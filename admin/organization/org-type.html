<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>组织类型管理 - 学会会员管理系统</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="wrapper">
    <div id="sidebar-container"></div>

    <div class="main">
      <div class="header">
        <div class="header-left">
          <div class="page-title">组织类型管理</div>
          <div class="breadcrumb"><a href="#">首页</a> / <a href="#">组织机构</a> / <span>组织类型</span></div>
        </div>
        <div class="header-right">
          <div class="user-info"><div class="avatar">李</div><span class="username">李管理员</span></div>
        </div>
      </div>

      <div class="content">
        <div class="card">
          <div class="card-header">
            <span class="card-title">组织类型列表</span>
            <div class="card-tools">
              <button class="btn btn-primary" onclick="openModal('addTypeModal')">+ 新增组织类型</button>
            </div>
          </div>
          <div class="card-body">
            <table class="table" id="orgTypeTable">
              <thead>
                <tr>
                  <th>类型名称</th>
                  <th>类型编码</th>
                  <th>分管部门</th>
                  <th>权重</th>
                  <th>说明</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>地方学会</td>
                  <td>LOCAL_SOCIETY</td>
                  <td><span class="tag tag-primary">会员组织部</span></td>
                  <td><input type="number" class="form-input" value="100" min="0" style="width: 70px; padding: 4px 8px;" onchange="showToast('权重已更新')"></td>
                  <td>各省、市、县农学会</td>
                  <td class="actions">
                    <button class="btn btn-default btn-sm" onclick="openModal('editTypeModal')">编辑</button>
                    <button class="btn btn-default btn-sm" onclick="if(confirm('确定删除该组织类型吗？')) { showToast('已删除'); }">删除</button>
                  </td>
                </tr>
                <tr>
                  <td>专业委员会</td>
                  <td>PROFESSIONAL_COMMITTEE</td>
                  <td><span class="tag tag-primary">学术部</span></td>
                  <td><input type="number" class="form-input" value="90" min="0" style="width: 70px; padding: 4px 8px;" onchange="showToast('权重已更新')"></td>
                  <td>各专业学科委员会</td>
                  <td class="actions">
                    <button class="btn btn-default btn-sm" onclick="openModal('editTypeModal')">编辑</button>
                    <button class="btn btn-default btn-sm" onclick="if(confirm('确定删除该组织类型吗？')) { showToast('已删除'); }">删除</button>
                  </td>
                </tr>
                <tr>
                  <td>理事单位</td>
                  <td>DIRECTOR_UNIT</td>
                  <td><span class="tag tag-primary">理事会</span></td>
                  <td><input type="number" class="form-input" value="80" min="0" style="width: 70px; padding: 4px 8px;" onchange="showToast('权重已更新')"></td>
                  <td>学会理事单位会员</td>
                  <td class="actions">
                    <button class="btn btn-default btn-sm" onclick="openModal('editTypeModal')">编辑</button>
                    <button class="btn btn-default btn-sm" onclick="if(confirm('确定删除该组织类型吗？')) { showToast('已删除'); }">删除</button>
                  </td>
                </tr>
                <tr>
                  <td>合作单位</td>
                  <td>COOPERATIVE_UNIT</td>
                  <td><span class="tag tag-primary">对外合作部</span></td>
                  <td><input type="number" class="form-input" value="70" min="0" style="width: 70px; padding: 4px 8px;" onchange="showToast('权重已更新')"></td>
                  <td>战略合作单位</td>
                  <td class="actions">
                    <button class="btn btn-default btn-sm" onclick="openModal('editTypeModal')">编辑</button>
                    <button class="btn btn-default btn-sm" onclick="if(confirm('确定删除该组织类型吗？')) { showToast('已删除'); }">删除</button>
                  </td>
                </tr>
                <tr>
                  <td>会员单位</td>
                  <td>MEMBER_UNIT</td>
                  <td><span class="tag tag-primary">会员组织部</span></td>
                  <td><input type="number" class="form-input" value="60" min="0" style="width: 70px; padding: 4px 8px;" onchange="showToast('权重已更新')"></td>
                  <td>普通单位会员</td>
                  <td class="actions">
                    <button class="btn btn-default btn-sm" onclick="openModal('editTypeModal')">编辑</button>
                    <button class="btn btn-default btn-sm" onclick="if(confirm('确定删除该组织类型吗？')) { showToast('已删除'); }">删除</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 新增组织类型弹窗 -->
  <div class="modal" id="addTypeModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <span class="modal-title">新增组织类型</span>
        <span class="close-btn" onclick="closeModal('addTypeModal')">✕</span>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">类型名称 <span class="required">*</span></label>
          <input type="text" class="form-input" placeholder="如：地方学会">
        </div>
        <div class="form-group">
          <label class="form-label">类型编码 <span class="required">*</span></label>
          <input type="text" class="form-input" placeholder="如：LOCAL_SOCIETY">
        </div>
        <div class="form-group">
          <label class="form-label">分管部门 <span class="required">*</span></label>
          <select class="form-select">
            <option>请选择分管部门</option>
            <option>会员组织部</option>
            <option>学术部</option>
            <option>财务部</option>
            <option>理事会</option>
            <option>对外合作部</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">排序</label>
          <input type="number" class="form-input" value="6">
        </div>
        <div class="form-group">
          <label class="form-label">说明</label>
          <textarea class="form-textarea" placeholder="请输入类型说明"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeModal('addTypeModal')">取消</button>
        <button class="btn btn-primary" onclick="closeModal('addTypeModal'); showToast('添加成功')">保存</button>
      </div>
    </div>
  </div>

  <!-- 编辑组织类型弹窗 -->
  <div class="modal" id="editTypeModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <span class="modal-title">编辑组织类型</span>
        <span class="close-btn" onclick="closeModal('editTypeModal')">✕</span>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">类型名称</label>
          <input type="text" class="form-input" value="地方学会">
        </div>
        <div class="form-group">
          <label class="form-label">类型编码</label>
          <input type="text" class="form-input" value="LOCAL_SOCIETY" readonly style="background: #f5f5f5; color: #999; cursor: not-allowed;">
        </div>
        <div class="form-group">
          <label class="form-label">分管部门</label>
          <select class="form-select">
            <option selected>会员组织部</option>
            <option>学术部</option>
            <option>财务部</option>
            <option>理事会</option>
            <option>对外合作部</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">排序</label>
          <input type="number" class="form-input" value="1">
        </div>
        <div class="form-group">
          <label class="form-label">说明</label>
          <textarea class="form-textarea">各省、市、县农学会</textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeModal('editTypeModal')">取消</button>
        <button class="btn btn-primary" onclick="closeModal('editTypeModal'); showToast('保存成功')">保存</button>
      </div>
    </div>
  </div>

  <script src="../../js/main.js"></script>
  <script src="../sidebar.js"></script>
</body>
</html>
