<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新增会员 - 学会会员管理系统</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="wrapper">
    <div id="sidebar-container"></div>

    <div class="main">
      <div class="header">
        <div class="header-left">
          <div class="page-title" id="pageTitle">新增会员</div>
          <div class="breadcrumb">
            <a href="personal-list.html">现任个人会员</a> / <span id="breadcrumbCurrent">新增会员</span>
          </div>
        </div>
        <div class="header-right">
          <div class="user-info"><div class="avatar">李</div><span class="username">李管理员</span></div>
        </div>
      </div>

      <div class="content">
        <!-- 会员类型选择 -->
        <div class="card" style="margin-bottom: 16px;">
          <div class="card-header">
            <span class="card-title" id="memberTypeTitle">选择会员类型</span>
            <span style="color: #ff4d4f; font-size: 13px;">信息变更审核中</span>
          </div>
          <div class="card-body">
            <div style="display: flex; gap: 16px;">
              <label class="member-type-option selected" data-type="normal">
                <input type="radio" name="memberType" value="normal" checked onchange="switchMemberType(this)">
                <span class="member-type-card">
                  <span class="member-type-name">普通个人会员</span>
                  <span class="member-type-desc">适用于一般个人用户</span>
                </span>
              </label>
              <label class="member-type-option" data-type="student">
                <input type="radio" name="memberType" value="student" onchange="switchMemberType(this)">
                <span class="member-type-card">
                  <span class="member-type-name">学生会员</span>
                  <span class="member-type-desc">适用于在校学生</span>
                </span>
              </label>
              <label class="member-type-option" data-type="foreign">
                <input type="radio" name="memberType" value="foreign" onchange="switchMemberType(this)">
                <span class="member-type-card">
                  <span class="member-type-name">外籍会员</span>
                  <span class="member-type-desc">适用于外籍人士</span>
                </span>
              </label>
            </div>
          </div>
        </div>

        <!-- 动态表单区域 -->
        <div id="formContainer">
          <!-- 基本信息 -->
          <div class="card" style="margin-bottom: 16px;">
            <div class="card-header"><span class="card-title">基本信息</span></div>
            <div class="card-body">
              <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
                <div class="form-group">
                  <label class="form-label">手机号 <span class="required">*</span></label>
                  <input type="text" class="form-input" placeholder="请输入手机号">
                </div>
                <div class="form-group">
                  <label class="form-label">发展来源</label>
                  <select class="form-select"><option>请选择</option><option>北京市农学会</option><option>上海市农学会</option><option>广东省农学会</option><option>作物学专业委员会</option></select>
                </div>
                <div class="form-group">
                  <label class="form-label">真实姓名 <span class="required">*</span></label>
                  <input type="text" class="form-input" placeholder="请输入真实姓名">
                </div>
                <div class="form-group">
                  <label class="form-label">用户性别</label>
                  <select class="form-select"><option>请选择</option><option>男</option><option>女</option></select>
                </div>
                <div class="form-group">
                  <label class="form-label">出生日期</label>
                  <input type="date" class="form-input">
                </div>
                <div class="form-group">
                  <label class="form-label">国籍</label>
                  <input type="text" class="form-input" placeholder="请输入国籍">
                </div>
                <div class="form-group">
                  <label class="form-label">护照号</label>
                  <input type="text" class="form-input" placeholder="请输入护照号">
                </div>
                <div class="form-group">
                  <label class="form-label">籍贯</label>
                  <input type="text" class="form-input" placeholder="请输入籍贯">
                </div>
                <div class="form-group">
                  <label class="form-label">民族</label>
                  <select class="form-select"><option>请选择</option><option>汉族</option><option>蒙古族</option><option>回族</option><option>其他</option></select>
                </div>
                <div class="form-group">
                  <label class="form-label">政治面貌</label>
                  <select class="form-select"><option>请选择</option><option>中共党员</option><option>共青团员</option><option>群众</option><option>其他</option></select>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                  <label class="form-label">身份证号</label>
                  <input type="text" class="form-input" placeholder="请输入身份证号">
                </div>
                <div class="form-group">
                  <label class="form-label">最高学历</label>
                  <select class="form-select"><option>请选择</option><option>博士研究生</option><option>硕士研究生</option><option>大学本科</option><option>大学专科</option></select>
                </div>
                <div class="form-group">
                  <label class="form-label">毕业院校</label>
                  <input type="text" class="form-input" placeholder="请输入毕业院校">
                </div>
                <div class="form-group">
                  <label class="form-label">专业</label>
                  <input type="text" class="form-input" placeholder="请输入专业">
                </div>
                <div class="form-group" style="grid-column: span 2;">
                  <label class="form-label">工作单位</label>
                  <input type="text" class="form-input" placeholder="请输入工作单位">
                </div>
                <div class="form-group">
                  <label class="form-label">职称/身份</label>
                  <input type="text" class="form-input" placeholder="请输入职称/身份">
                </div>
                <div class="form-group">
                  <label class="form-label">工作单位电话号码</label>
                  <input type="text" class="form-input" placeholder="请输入工作单位电话号码">
                </div>
                <div class="form-group">
                  <label class="form-label">邮箱</label>
                  <input type="email" class="form-input" placeholder="请输入邮箱">
                </div>
                <div class="form-group">
                  <label class="form-label">所在地区</label>
                  <input type="text" class="form-input" placeholder="请输入所在地区">
                </div>
                <div class="form-group">
                  <label class="form-label">详细地址</label>
                  <input type="text" class="form-input" placeholder="请输入详细地址">
                </div>
                <div class="form-group">
                  <label class="form-label">照片</label>
                  <input type="file" class="form-input">
                </div>
                <div class="form-group" style="grid-column: span 2;">
                  <label class="form-label">感兴趣的分支机构</label>
                  <select class="form-select"><option>请选择</option><option>作物学专业委员会</option><option>园艺学专业委员会</option><option>植物保护专业委员会</option><option>秘书处</option></select>
                </div>
              </div>
            </div>
          </div>

          <div class="card" style="margin-bottom: 16px;">
            <div class="card-header"><span class="card-title">学生信息</span></div>
            <div class="card-body">
              <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
                <div class="form-group"><label class="form-label">在读学校</label><input type="text" class="form-input" placeholder="请输入在读学校"></div>
                <div class="form-group"><label class="form-label">入学时间</label><input type="date" class="form-input"></div>
                <div class="form-group"><label class="form-label">毕业时间</label><input type="date" class="form-input"></div>
                <div class="form-group"><label class="form-label">在读专业</label><input type="text" class="form-input" placeholder="请输入在读专业"></div>
                <div class="form-group"><label class="form-label">学生证号</label><input type="text" class="form-input" placeholder="请输入学生证号"></div>
              </div>
            </div>
          </div>

          <div class="card" style="margin-bottom: 16px;">
            <div class="card-header"><span class="card-title">其他信息</span></div>
            <div class="card-body">
              <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
                <div class="form-group" style="grid-column: span 4;"><label class="form-label">主要成就</label><textarea class="form-textarea" rows="3" placeholder="请输入主要成就"></textarea></div>
                <div class="form-group" style="grid-column: span 2;"><label class="form-label">研究方向</label><input type="text" class="form-input" placeholder="请输入研究方向"></div>
                <div class="form-group" style="grid-column: span 2;"><label class="form-label">发表论著情况</label><input type="text" class="form-input" placeholder="请输入发表论著情况"></div>
                <div class="form-group" style="grid-column: span 2;"><label class="form-label">主要科技成果</label><input type="text" class="form-input" placeholder="请输入主要科技成果"></div>
                <div class="form-group" style="grid-column: span 2;"><label class="form-label">获奖情况</label><input type="text" class="form-input" placeholder="请输入获奖情况"></div>
                <div class="form-group" style="grid-column: span 4;"><label class="form-label">国内外工作经历和成就</label><textarea class="form-textarea" rows="3" placeholder="请输入国内外工作经历和成就"></textarea></div>
              </div>
            </div>
          </div>

          <div class="card" style="margin-bottom: 16px;">
            <div class="card-header"><span class="card-title">荣誉/专家信息</span></div>
            <div class="card-body">
              <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
                <div class="form-group"><label class="form-label">是否人大代表</label><select class="form-select"><option>请选择</option><option>是</option><option>否</option></select></div>
                <div class="form-group"><label class="form-label">是否政协委员</label><select class="form-select"><option>请选择</option><option>是</option><option>否</option></select></div>
                <div class="form-group"><label class="form-label">是否突出贡献专家</label><select class="form-select"><option>请选择</option><option>是</option><option>否</option></select></div>
                <div class="form-group"><label class="form-label">是否政府特贴专家</label><select class="form-select"><option>请选择</option><option>是</option><option>否</option></select></div>
                <div class="form-group"><label class="form-label">是否院士</label><select class="form-select"><option>请选择</option><option>是</option><option>否</option></select></div>
                <div class="form-group"><label class="form-label">是否长江学者</label><select class="form-select"><option>请选择</option><option>是</option><option>否</option></select></div>
                <div class="form-group"><label class="form-label">是否杰青</label><select class="form-select"><option>请选择</option><option>是</option><option>否</option></select></div>
              </div>
            </div>
          </div>

          <div class="card" style="margin-bottom: 16px;">
            <div class="card-header"><span class="card-title">学会任职 & 国际交流</span></div>
            <div class="card-body">
              <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
                <div class="form-group"><label class="form-label">何时加入本会</label><input type="date" class="form-input"></div>
                <div class="form-group"><label class="form-label">在本会担任的职务</label><input type="text" class="form-input" placeholder="请输入在本会担任的职务"></div>
                <div class="form-group"><label class="form-label">掌握哪种外语</label><input type="text" class="form-input" placeholder="请输入掌握哪种外语"></div>
                <div class="form-group"><label class="form-label">外语熟练程度</label><select class="form-select"><option>请选择</option><option>精通</option><option>熟练</option><option>一般</option><option>入门</option></select></div>
              </div>
            </div>
          </div>

          <div class="card" style="margin-bottom: 16px;">
            <div class="card-header"><span class="card-title">社会职务 & 家庭信息</span></div>
            <div class="card-body">
              <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
                <div class="form-group" style="grid-column: span 2;"><label class="form-label">社会职务</label><input type="text" class="form-input" placeholder="请输入社会职务"></div>
                <div class="form-group"><label class="form-label">家庭电话号码</label><input type="text" class="form-input" placeholder="请输入家庭电话号码"></div>
                <div class="form-group" style="grid-column: span 2;"><label class="form-label">家庭通讯地址</label><input type="text" class="form-input" placeholder="请输入家庭通讯地址"></div>
              </div>
            </div>
          </div>

          <div class="card" style="margin-bottom: 16px;">
            <div class="card-header"><span class="card-title">个人简介</span></div>
            <div class="card-body"><textarea class="form-textarea" rows="4" placeholder="请输入简介"></textarea></div>
          </div>

          <div class="card" style="margin-bottom: 16px;">
            <div class="card-header"><span class="card-title">自定义字段</span></div>
            <div class="card-body">
              <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
                <div class="form-group" style="grid-column: span 2;"><label class="form-label">研究方向（自定义）</label><input type="text" class="form-input" placeholder="请输入研究方向（自定义）"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- 操作按钮 -->
        <div class="card">
          <div class="card-body" style="display: flex; justify-content: flex-end; gap: 12px;">
            <button class="btn btn-default btn-lg" onclick="location.href='personal-list.html'">取消</button>
            <button class="btn btn-primary btn-lg" onclick="submitForm()">保存</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/main.js"></script>
  <style>
    .member-type-option { cursor: pointer; }
    .member-type-option input { display: none; }
    .member-type-card {
      display: flex;
      flex-direction: column;
      padding: 16px 24px;
      border: 2px solid #e8e8e8;
      border-radius: 8px;
      transition: all 0.3s;
    }
    .member-type-option:hover .member-type-card { border-color: #1890ff; }
    .member-type-option.selected .member-type-card {
      border-color: #1890ff;
      background: #e6f7ff;
    }
    .member-type-name {
      font-size: 15px;
      font-weight: 500;
      color: #333;
    }
    .member-type-option.selected .member-type-name { color: #1890ff; }
    .member-type-desc {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
  </style>

    // 会员类型切换仅更新选中态
    function switchMemberType(el) {
      var type = el.value;
      var options = document.querySelectorAll('.member-type-option');
      options.forEach(function(opt) {
        opt.classList.remove('selected');
        if (opt.dataset.type === type) {
          opt.classList.add('selected');
        }
      });
    }

    function setFieldValue(labelText, value, readonly) {
      var labels = document.querySelectorAll('.form-label');
      labels.forEach(function(label) {
        var text = label.textContent.replace('*', '').trim();
        if (text === labelText) {
          var group = label.closest('.form-group');
          if (!group) return;
          var input = group.querySelector('input, select, textarea');
          if (!input) return;
          if (input.tagName === 'SELECT') {
            Array.from(input.options).forEach(function(option) {
              option.selected = option.text === value;
            });
          } else if (input.tagName === 'TEXTAREA') {
            input.value = value;
          } else {
            input.value = value;
          }
          if (readonly) {
            input.setAttribute('readonly', 'readonly');
            input.setAttribute('disabled', 'disabled');
          }
        }
      });
    }

    function initEditMode() {
      var params = new URLSearchParams(location.search);
      var memberId = params.get('id');
      if (!memberId) return;

      document.getElementById('pageTitle').textContent = '编辑会员';
      document.getElementById('breadcrumbCurrent').textContent = '编辑会员';
      document.title = '编辑会员 - 学会会员管理系统';

      Object.keys(memberEditMockData).forEach(function(key) {
        setFieldValue(key, memberEditMockData[key], key === '手机号');
      });
    }

    function submitForm() {
      showToast('保存成功');
      setTimeout(function() {
        location.href = 'personal-list.html';
      }, 1000);
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
      initEditMode();
    });
  </script>
  <script src="../sidebar.js"></script>
</body>
</html>
