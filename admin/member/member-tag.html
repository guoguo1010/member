  <style>
    .tag-tree { padding: 8px 0; }
    .tag-item { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid #f0f0f0; }
    .tag-item:last-child { border-bottom: none; }
    .tag-item:hover { background: #fafafa; }
    .tag-item .tag-name { width: 300px; font-weight: 500; }
    .tag-item .tag-parent { width: 200px; color: #999; font-size: 13px; text-align: center; }
    .tag-item .tag-count { width: 120px; text-align: center; color: #666; }
    .tag-item .tag-status { width: 100px; text-align: center; }
    .tag-item .tag-display { width: 100px; text-align: center; }
    .tag-item .tag-actions { flex: 1; text-align: right; }
    .child-tag { padding-left: 40px; background: #fafafa; }
    .child-tag .tag-name { color: #666; font-weight: normal; }
    .parent-tag { font-weight: 600; }
    .parent-tag .tag-name { color: #333; }
    .tag-level-1 { padding-left: 0; }
    .tag-toggle { cursor: pointer; margin-right: 8px; color: #999; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 22px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #52c41a; }
    input:checked + .slider:before { transform: translateX(18px); }
  </style>
</head>

  <script>
    window.addEventListener('load', function() {
      var origOpenModal = window.openModal;
      var origCloseModal = window.closeModal;
      window.openModal = function(id) {
        origOpenModal(id);
        if (id === 'editTagModal') {
          setTimeout(function() { initCharCount('editTagName', 'editTagCount'); }, 0);
        }
      };
      window.closeModal = origCloseModal;
    });
    function updateCharCount(input, counterId) {
      document.getElementById(counterId).textContent = input.value.length + '/50';
    }
    function initCharCount(inputId, counterId) {
      var input = document.getElementById(inputId);
      if (input) updateCharCount(input, counterId);
    }
    function toggleStatus(el) {
      var isChecked = el.checked;
      showToast(isChecked ? '已启用' : '已禁用');
    }
    function toggleDisplay(el) {
      var isChecked = el.checked;
      showToast(isChecked ? '已开启对外展示' : '已关闭对外展示');
    }
    function addChildTag(parentName) {
      document.getElementById('childTagParentName').value = parentName;
      openModal('addChildTagModal');
    }
    function toggleChildren(el) {
      var item = el.closest('.tag-item');
      var nextEl = item.nextElementSibling;
      var isExpanded = el.textContent === '▼';

      if (isExpanded) {
        el.textContent = '▶';
        while (nextEl && nextEl.classList.contains('child-tag')) {
          nextEl.style.display = 'none';
          nextEl = nextEl.nextElementSibling;
        }
      } else {
        el.textContent = '▼';
        while (nextEl && nextEl.classList.contains('child-tag')) {
          nextEl.style.display = '';
          nextEl = nextEl.nextElementSibling;
        }
      }
    }
  </script>
  <script src="../sidebar.js"></script>
</body>
</html>
