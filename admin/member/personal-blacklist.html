<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人会员黑名单 - 学会会员管理系统</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    /* 确认弹窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 8px;
      width: 400px;
      max-width: 90%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header .modal-title { font-size: 16px; font-weight: 600; color: #333; }
    .modal-header .modal-close {
      width: 24px; height: 24px;
      background: none; border: none;
      cursor: pointer; font-size: 18px;
      color: #999; line-height: 1;
    }
    .modal-body {
      padding: 24px 20px;
      font-size: 14px; color: #555; line-height: 1.6;
    }
    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid #eee;
      display: flex; justify-content: flex-end; gap: 12px;
    }
    .modal-footer .btn { padding: 6px 20px; font-size: 14px; border-radius: 4px; cursor: pointer; }
    .btn-cancel { background: #fff; border: 1px solid #dcdfe6; color: #606266; }
    .btn-cancel:hover { border-color: #c0c4cc; color: #606266; }
    .btn-confirm { background: #1898de; border: 1px solid #1898de; color: #fff; }
    .btn-confirm:hover { background: #1578c2; border-color: #1578c2; }
    .btn-danger { background: #f56c6c; border: 1px solid #f56c6c; color: #fff; }
    .btn-danger:hover { background: #e64545; border-color: #e64545; }
    /* Toast */
    .toast {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; padding: 10px 20px; border-radius: 4px;
      font-size: 14px; z-index: 2000; display: none;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="sidebar-container"></div>

    <div class="main">
      <div class="header">
        <div class="header-left">
          <div class="page-title">个人会员黑名单</div>
          <div class="breadcrumb"><a href="#">首页</a> / <a href="#">个人会员</a> / <span>黑名单列表</span></div>
        </div>
        <div class="header-right">
          <div class="user-info"><div class="avatar">李</div><span class="username">李管理员</span></div>
        </div>
      </div>

      <div class="content">
        <div class="card">
          <div class="card-header">
            <span class="card-title">黑名单会员列表</span>
          </div>
          <div class="card-body">
            <div class="search-bar">
              <div class="search-item">
                <label>姓名：</label>
                <input type="text" class="form-input" placeholder="请输入姓名" style="width: 120px;">
              </div>
              <div class="search-item">
                <label>手机号：</label>
                <input type="text" class="form-input" placeholder="请输入手机号" style="width: 140px;">
              </div>
              <div class="search-item">
                <label>会员编号：</label>
                <input type="text" class="form-input" placeholder="请输入会员编号" style="width: 150px;">
              </div>
              <div class="search-item">
                <label>会员类型：</label>
                <select class="form-input" style="width: 140px;">
                  <option value="">全部</option>
                  <option>普通个人会员</option>
                  <option>学生会员</option>
                  <option>高级会员</option>
                </select>
              </div>
              <div class="search-item">
                <label>加入黑名单时间：</label>
                <input type="date" class="form-input" style="width: 140px;">
                <span style="margin: 0 4px;">至</span>
                <input type="date" class="form-input" style="width: 140px;">
              </div>
              <button class="btn btn-default btn-sm">查询</button>
              <button class="btn btn-default btn-sm">重置</button>
            </div>

            <table class="table">
              <thead>
                <tr>
                  <th>会员编号</th>
                  <th>姓名</th>
                  <th>性别</th>
                  <th>手机号</th>
                  <th>会员类型</th>
                  <th>发展来源</th>
                  <th>加入黑名单时间</th>
                  <th>黑名单原因</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>M20240100001</td>
                  <td>张三</td>
                  <td>男</td>
                  <td>138****8001</td>
                  <td><span class="tag tag-primary">普通个人会员</span></td>
                  <td>北京市农学会</td>
                  <td>2026-07-10 10:20</td>
                  <td>多次违规发表不当言论</td>
                  <td class="actions">
                    <button class="btn btn-default btn-sm" onclick="location.href='personal-detail.html'">详情</button>
                    <button class="btn btn-default btn-sm" onclick="showConfirm('张三', this)">移出黑名单</button>
                  </td>
                </tr>
                <tr>
                  <td>M20240100002</td>
                  <td>李四</td>
                  <td>女</td>
                  <td>138****8002</td>
                  <td><span class="tag tag-primary">普通个人会员</span></td>
                  <td>山东省农学会</td>
                  <td>2026-07-09 16:45</td>
                  <td>未按规定缴纳会费超过两年</td>
                  <td class="actions">
                    <button class="btn btn-default btn-sm" onclick="location.href='personal-detail.html'">详情</button>
                    <button class="btn btn-default btn-sm" onclick="showConfirm('李四', this)">移出黑名单</button>
                  </td>
                </tr>
              </tbody>
            </table>

            <div class="pagination">
              <div class="pagination-info">共 2 条</div>
              <div class="pagination-btns">
                <button class="page-btn" disabled>上一页</button>
                <button class="page-btn active">1</button>
                <button class="page-btn" disabled>下一页</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/main.js"></script>
  <script src="../sidebar.js"></script>
  <script>
    function showConfirm(memberName, btn) {
      document.getElementById('confirmMemberName').textContent = memberName;
      document.getElementById('confirmModal').classList.add('active');
      document.getElementById('confirmModal').dataset.targetBtn = btn;
    }
    function closeConfirm() {
      document.getElementById('confirmModal').classList.remove('active');
    }
    function submitRemove() {
      closeConfirm();
      var btn = document.getElementById('confirmModal').dataset.targetBtn;
      if (btn) btn.disabled = true;
      showToast('已移出黑名单');
    }
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); }, 2000);
    }
  </script>
  <!-- 确认弹窗 -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">确认移出黑名单</span>
        <button class="modal-close" onclick="closeConfirm()">×</button>
      </div>
      <div class="modal-body">
        确定要将 <strong id="confirmMemberName"></strong> 移出黑名单吗？
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" onclick="closeConfirm()">取消</button>
        <button class="btn btn-danger" onclick="submitRemove()">确定移出</button>
      </div>
    </div>
  </div>
  <!-- Toast -->
  <div class="toast" id="toast"></div>
</body>
</html>
