<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑单位会员 - 学会会员管理系统</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="wrapper">
    <div id="sidebar-container"></div>

    <div class="main">
      <div class="header">
        <div class="header-left">
          <div class="page-title">编辑单位会员</div>
          <div class="breadcrumb">
            <a href="company-list.html">现任单位会员</a> / <span>编辑会员</span>
          </div>
        </div>
        <div class="header-right">
          <div class="user-info"><div class="avatar">李</div><span class="username">李管理员</span></div>
        </div>
      </div>

      <div class="content">
        <!-- 会员类型 -->
        <div class="card" style="margin-bottom: 16px;">
          <div class="card-header">
            <span class="card-title">会员类型</span>
          </div>
          <div class="card-body">
            <div style="display: flex; gap: 16px;">
              <label class="member-type-option selected">
                <input type="radio" name="memberType" value="normal" checked disabled>
                <span class="member-type-card">
                  <span class="member-type-name">普通单位会员</span>
                  <span class="member-type-desc">适用于一般企业单位</span>
                </span>
              </label>
              <label class="member-type-option disabled">
                <input type="radio" name="memberType" value="director" disabled>
                <span class="member-type-card">
                  <span class="member-type-name">理事单位会员</span>
                  <span class="member-type-desc">适用于理事单位</span>
                </span>
              </label>
            </div>
          </div>
        </div>

        <!-- 单位基本信息 -->
        <div class="card" style="margin-bottom: 16px;">
          <div class="card-header">
            <span class="card-title">单位基本信息</span>
          </div>
          <div class="card-body">
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
              <div class="form-group">
                <label class="form-label">发展来源</label>
                <select class="form-select">
                  <option selected>北京市农学会</option>
                  <option>上海市农学会</option>
                  <option>广东省农学会</option>
                  <option>山东省农学会</option>
                </select>
              </div>
              <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">单位名称 <span class="required">*</span></label>
                <input type="text" class="form-input" value="北京科技有限公司" placeholder="请输入单位名称">
              </div>
              <div class="form-group">
                <label class="form-label">单位类别</label>
                <select class="form-select">
                  <option>行政机关</option>
                  <option>事业单位（科研机构）</option>
                  <option selected>国有（控股）企业</option>
                  <option>外资或合资企业</option>
                  <option>私营（民营）企业</option>
                  <option>社会组织</option>
                  <option>高校二级学院</option>
                  <option>其他</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">所属行业</label>
                <select class="form-select">
                  <option selected>农业科技</option>
                  <option>农业种植</option>
                  <option>农业养殖</option>
                  <option>农产品加工</option>
                  <option>农业服务</option>
                </select>
              </div>
              <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">所在地区</label>
                <div style="display: flex; gap: 8px;">
                  <select class="form-select" style="flex: 1;">
                    <option selected>北京市</option>
                    <option>上海市</option>
                    <option>广东省</option>
                  </select>
                  <select class="form-select" style="flex: 1;">
                    <option selected>北京市</option>
                    <option>上海市</option>
                    <option>广州市</option>
                  </select>
                  <select class="form-select" style="flex: 1;">
                    <option selected>海淀区</option>
                    <option>朝阳区</option>
                    <option>东城区</option>
                  </select>
                </div>
              </div>
              <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">通讯地址</label>
                <input type="text" class="form-input" value="北京市海淀区中关村南大街12号" placeholder="请输入通讯地址">
              </div>
              <div class="form-group">
                <label class="form-label">单位Logo</label>
                <input type="file" class="form-input">
              </div>
              <div class="form-group">
                <label class="form-label">单位网址</label>
                <input type="text" class="form-input" value="www.example.com" placeholder="请输入单位网址">
              </div>
              <div class="form-group" style="grid-column: span 4;">
                <label class="form-label">感兴趣的分支机构</label>
                <select class="form-select" multiple style="height: 112px;">
                  <option selected>作物学专业委员会</option>
                  <option selected>园艺学专业委员会</option>
                  <option>植物保护专业委员会</option>
                  <option>农业工程专业委员会</option>
                </select>
              </div>
              <div class="form-group" style="grid-column: span 4;">
                <label class="form-label">单位简介</label>
                <textarea class="form-textarea" rows="3" placeholder="请输入单位简介">北京科技有限公司成立于2015年，是一家专注于农业科技创新的高新技术企业。公司主要从事农业智能化设备研发、现代农业技术推广等服务。</textarea>
              </div>
            </div>
          </div>
        </div>

        <!-- 单位信息 -->
        <div class="card" style="margin-bottom: 16px;">
          <div class="card-header">
            <span class="card-title">单位信息（如为高校二级学院，请填写高校本级信息）</span>
          </div>
          <div class="card-body">
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
              <div class="form-group">
                <label class="form-label">成立时间</label>
                <input type="date" class="form-input" value="2015-06-20">
              </div>
              <div class="form-group">
                <label class="form-label">注册资金</label>
                <input type="text" class="form-input" value="1000万元" placeholder="请输入注册资金">
              </div>
              <div class="form-group">
                <label class="form-label">法定代表人</label>
                <input type="text" class="form-input" value="张总" placeholder="请输入法定代表人">
              </div>
              <div class="form-group">
                <label class="form-label">社会统一信用代码 <span class="required">*</span></label>
                <input type="text" class="form-input" value="91110000XXXXXXXX" placeholder="请输入统一社会信用代码">
              </div>
              <div class="form-group">
                <label class="form-label">职工人数</label>
                <input type="text" class="form-input" value="500人" placeholder="请输入职工人数">
              </div>
              <div class="form-group">
                <label class="form-label">产业规模（万元）</label>
                <input type="text" class="form-input" value="6800" placeholder="请输入产业规模">
              </div>
              <div class="form-group">
                <label class="form-label">营业执照</label>
                <input type="file" class="form-input">
              </div>
            </div>
          </div>
        </div>

        <!-- 单位负责人信息 -->
        <div class="card" style="margin-bottom: 16px;">
          <div class="card-header">
            <span class="card-title">单位负责人信息</span>
          </div>
          <div class="card-body">
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
              <div class="form-group">
                <label class="form-label">姓名 <span class="required">*</span></label>
                <input type="text" class="form-input" value="张总" placeholder="请输入姓名">
              </div>
              <div class="form-group">
                <label class="form-label">性别</label>
                <select class="form-select">
                  <option selected>男</option>
                  <option>女</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">职务/职称</label>
                <input type="text" class="form-input" value="董事长 / 高级工程师" placeholder="请输入职务/职称">
              </div>
              <div class="form-group">
                <label class="form-label">所在部门</label>
                <input type="text" class="form-input" value="董事会" placeholder="请输入所在部门">
              </div>
              <div class="form-group">
                <label class="form-label">办公电话</label>
                <input type="text" class="form-input" value="010-12345678" placeholder="请输入办公电话">
              </div>
              <div class="form-group">
                <label class="form-label">手机号码 <span class="required">*</span></label>
                <input type="text" class="form-input" value="13800138001" placeholder="请输入手机号码">
              </div>
              <div class="form-group">
                <label class="form-label">电子邮箱</label>
                <input type="email" class="form-input" value="zhang@example.com" placeholder="请输入电子邮箱">
              </div>
            </div>
          </div>
        </div>

        <!-- 联系人信息 -->
        <div class="card" style="margin-bottom: 16px;">
          <div class="card-header">
            <span class="card-title">联系人信息</span>
          </div>
          <div class="card-body">
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
              <div class="form-group">
                <label class="form-label">姓名</label>
                <input type="text" class="form-input" value="李联系人" placeholder="请输入姓名">
              </div>
              <div class="form-group">
                <label class="form-label">性别</label>
                <select class="form-select">
                  <option selected>女</option>
                  <option>男</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">年龄</label>
                <input type="text" class="form-input" value="36" placeholder="请输入年龄">
              </div>
              <div class="form-group">
                <label class="form-label">职务/职称</label>
                <input type="text" class="form-input" value="行政经理 / 中级工程师" placeholder="请输入职务/职称">
              </div>
              <div class="form-group">
                <label class="form-label">所在部门</label>
                <input type="text" class="form-input" value="行政部" placeholder="请输入所在部门">
              </div>
              <div class="form-group">
                <label class="form-label">手机号码</label>
                <input type="text" class="form-input" value="13900139001" readonly style="background:#f5f5f5;color:#999;cursor:not-allowed;">
              </div>
              <div class="form-group">
                <label class="form-label">电子邮箱</label>
                <input type="email" class="form-input" value="li@example.com" placeholder="请输入电子邮箱">
              </div>
              <div class="form-group">
                <label class="form-label">办公电话</label>
                <input type="text" class="form-input" value="010-11111111" placeholder="请输入办公电话">
              </div>
              <div class="form-group">
                <label class="form-label">传真</label>
                <input type="text" class="form-input" value="010-22222222" placeholder="请输入传真">
              </div>
              <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">通讯地址</label>
                <input type="text" class="form-input" value="北京市海淀区中关村南大街12号A座8层" placeholder="请输入通讯地址">
              </div>
              <div class="form-group">
                <label class="form-label">邮编</label>
                <input type="text" class="form-input" value="100000" placeholder="请输入邮编">
              </div>
            </div>
          </div>
        </div>

        <!-- 操作按钮 -->
        <div class="card">
          <div class="card-body" style="display: flex; justify-content: flex-end; gap: 12px;">
            <button class="btn btn-default btn-lg" onclick="location.href='company-list.html'">取消</button>
            <button class="btn btn-primary btn-lg" onclick="submitForm()">保存</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/main.js"></script>
  <style>
    .member-type-option { cursor: pointer; }
    .member-type-option input { display: none; }
    .member-type-card {
      display: flex;
      flex-direction: column;
      padding: 16px 24px;
      border: 2px solid #e8e8e8;
      border-radius: 8px;
      transition: all 0.3s;
    }
    .member-type-option:hover .member-type-card { border-color: #1890ff; }
    .member-type-option.selected .member-type-card {
      border-color: #1890ff;
      background: #e6f7ff;
    }
    .member-type-option.disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }
    .member-type-option.disabled .member-type-card {
      border-color: #e8e8e8;
    }
    .member-type-name {
      font-size: 15px;
      font-weight: 500;
      color: #333;
    }
    .member-type-option.selected .member-type-name { color: #1890ff; }
    .member-type-desc {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
  </style>
  <script>
    function submitForm() {
      showToast('保存成功');
      setTimeout(function() {
        location.href = 'company-list.html';
      }, 1000);
    }
  </script>
  <script src="../sidebar.js"></script>
</body>
</html>
