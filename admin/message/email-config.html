<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邮箱管理 - 学会会员管理系统</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="wrapper">
    <div id="sidebar-container"></div>

    <div class="main">
      <div class="header">
        <div class="header-left">
          <div class="page-title">邮箱管理</div>
          <div class="breadcrumb">
            <a href="email.html">邮件管理</a> / <span>邮箱管理</span>
          </div>
        </div>
        <div class="header-right">
          <div class="user-info"><div class="avatar">李</div><span class="username">李管理员</span></div>
        </div>
      </div>

      <div class="content">
        <div class="card" style="margin-bottom: 16px;">
          <div class="card-header">
            <span class="card-title">邮箱列表</span>
        <div class="card-tools">
            <button class="btn btn-primary" onclick="openModal('addMailboxModal')">+ 新增邮箱</button>
            </div>
          </div>
          <div class="card-body">
            <table class="table">
              <thead>
             <tr>
              <th>邮箱名称</th>
                  <th>邮箱账号</th>
                  <th>SMTP服务器</th>
                  <th>端口</th>
             <th>状态</th>
               <th>操作</th>
                </tr>
          </thead>
              <tbody>
                <tr>
               <td>官方邮箱</td>
              <td>noreply@caass.org.cn</td>
                  <td>smtp.exmail.qq.com</td>
              <td>465</td>
                  <td>
              <label class="switch">
                      <input type="checkbox" checked>
                      <span class="switch-slider"></span>
                </label>
                  </td>
                  <td class="actions">
                 <button class="btn btn-default btn-sm" onclick="openModal('editMailboxModal')">编辑</button>
              <button class="btn btn-default btn-sm" onclick="showToast('正在测试连接...')">测试连接</button>
               <button class="btn btn-default btn-sm" onclick="if(confirm('确定删除该邮箱吗？')) showToast('删除成功')">删除</button>
                </td>
            </tr>
           <tr>
            <td>通知邮箱</td>
                  <td>notify@caass.org.cn</td>
                  <td>smtp.exmail.qq.com</td>
                <td>465</td>
               <td>
                    <label class="switch">
                 <input type="checkbox" checked>
                      <span class="switch-slider"></span>
               </label>
                </td>
              <td class="actions">
                 <button class="btn btn-default btn-sm" onclick="openModal('editMailboxModal')">编辑</button>
                <button class="btn btn-default btn-sm" onclick="showToast('正在测试连接...')">测试连接</button>
             <button class="btn btn-default btn-sm" onclick="if(confirm('确定删除该邮箱吗？')) showToast('删除成功')">删除</button>
             </td>
         </tr>
                <tr>
              <td>系统邮箱</td>
                  <td>system@caass.org.cn</td>
                <td>smtp.exmail.qq.com</td>
                  <td>465</td>
                  <td>
                <label class="switch">
                      <input type="checkbox">
                   <span class="switch-slider"></span>
                    </label>
                  </td>
                  <td class="actions">
                 <button class="btn btn-default btn-sm" onclick="openModal('editMailboxModal')">编辑</button>
                    <button class="btn btn-default btn-sm" onclick="showToast('正在测试连接...')">测试连接</button>
                    <button class="btn btn-default btn-sm" onclick="if(confirm('确定删除该邮箱吗？')) showToast('删除成功')">删除</button>
                  </td>
                </tr>
           </tbody>
            </table>
          </div>
        </div>


      </div>
    </div>
  </div>

  <!-- 新增邮箱弹窗 -->
  <div class="modal" id="addMailboxModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <span class="modal-title">新增邮箱</span>
        <span class="close-btn" onclick="closeModal('addMailboxModal')">✕</span>
      </div>
      <div class="modal-body">
        <div class="form-group">
       <label class="form-label">邮箱名称 <span class="required">*</span></label>
          <input type="text" class="form-input" placeholder="请输入邮箱名称，如：官方邮箱">
        </div>
        <div class="form-group">
          <label class="form-label">发件人名称 <span class="required">*</span></label>
          <input type="text" class="form-input" placeholder="请输入发件人名称">
        </div>
      <div class="form-group">
          <label class="form-label">SMTP 服务器 <span class="required">*</span></label>
          <input type="text" class="form-input" placeholder="请输入SMTP服务器地址">
        </div>
        <div class="form-group">
          <label class="form-label">SMTP 端口 <span class="required">*</span></label>
        <input type="number" class="form-input" value="465" placeholder="请输入SMTP端口">
    </div>
        <div class="form-group">
          <label class="form-label">邮箱账号 <span class="required">*</span></label>
          <input type="email" class="form-input" placeholder="请输入邮箱账号">
        </div>
        <div class="form-group">
          <label class="form-label">邮箱密码/授权码 <span class="required">*</span></label>
          <input type="password" class="form-input" placeholder="请输入邮箱密码或授权码">
        </div>
        <div class="form-group">
          <label class="form-label">使用 SSL</label>
          <label class="switch" style="margin-top: 8px;">
            <input type="checkbox" checked>
            <span class="switch-slider"></span>
      </label>
        </div>
        <div class="form-group">
          <label class="form-label">状态</label>
          <label class="switch" style="margin-top: 8px;">
         <input type="checkbox" checked>
         <span class="switch-slider"></span>
          </label>
       <span style="margin-left: 12px; color: #666; font-size: 13px;">启用后可用于发送邮件</span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeModal('addMailboxModal')">取消</button>
        <button class="btn btn-primary" onclick="closeModal('addMailboxModal'); showToast('添加成功')">保存</button>
      </div>
    </div>
  </div>

  <!-- 编辑邮箱弹窗 -->
  <div class="modal" id="editMailboxModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <span class="modal-title">编辑邮箱</span>
      <span class="close-btn" onclick="closeModal('editMailboxModal')">✕</span>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">邮箱名称 <span class="required">*</span></label>
          <input type="text" class="form-input" value="官方邮箱" placeholder="请输入邮箱名称">
        </div>
        <div class="form-group">
          <label class="form-label">发件人名称 <span class="required">*</span></label>
          <input type="text" class="form-input" value="中国农学会" placeholder="请输入发件人名称">
        </div>
        <div class="form-group">
          <label class="form-label">SMTP 服务器 <span class="required">*</span></label>
          <input type="text" class="form-input" value="smtp.exmail.qq.com" placeholder="请输入SMTP服务器地址">
        </div>
        <div class="form-group">
          <label class="form-label">SMTP 端口 <span class="required">*</span></label>
          <input type="number" class="form-input" value="465" placeholder="请输入SMTP端口">
        </div>
        <div class="form-group">
          <label class="form-label">邮箱账号 <span class="required">*</span></label>
          <input type="email" class="form-input" value="noreply@caass.org.cn" placeholder="请输入邮箱账号">
        </div>
     <div class="form-group">
       <label class="form-label">邮箱密码/授权码 <span class="required">*</span></label>
          <input type="password" class="form-input" value="********" placeholder="请输入邮箱密码或授权码">
        </div>
        <div class="form-group">
        <label class="form-label">使用 SSL</label>
          <label class="switch" style="margin-top: 8px;">
            <input type="checkbox" checked>
            <span class="switch-slider"></span>
          </label>
      </div>
      <div class="form-group">
          <label class="form-label">状态</label>
          <label class="switch" style="margin-top: 8px;">
            <input type="checkbox" checked>
            <span class="switch-slider"></span>
          </label>
          <span style="margin-left: 12px; color: #666; font-size: 13px;">启用后可用于发送邮件</span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeModal('editMailboxModal')">取消</button>
        <button class="btn btn-primary" onclick="closeModal('editMailboxModal'); showToast('保存成功')">保存</button>
      </div>
    </div>
  </div>

  <script src="../../js/main.js"></script>
  <script src="../sidebar.js"></script>
</body>
</html>
