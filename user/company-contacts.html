<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>其他联系人 - 中国农学会</title>
  <link rel="stylesheet" href="../css/web.css">
  <script src="../js/vue.global.js"></script>
  <script src="../js/element-plus.js"></script>
  <script src="../js/icons-vue.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%); min-height: 100vh; }

    .navbar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 0 40px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .navbar-logo { display: flex; align-items: center; gap: 12px; color: white; font-size: 20px; font-weight: 600; }
    .navbar-logo-icon { font-size: 32px; }
    .navbar-menu { display: flex; gap: 4px; }
    .navbar-item { padding: 10px 20px; color: rgba(255, 255, 255, 0.9); text-decoration: none; border-radius: 8px; transition: all 0.3s; font-size: 15px; }
    .navbar-item:hover { background: rgba(255, 255, 255, 0.2); color: white; }
    .navbar-item.active { background: rgba(255, 255, 255, 0.3); color: white; }
    .navbar-user { display: flex; align-items: center; gap: 16px; color: white; }
    .navbar-avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: all 0.3s; }
    .navbar-avatar:hover { transform: scale(1.1); }

    .user-dropdown { position: relative; cursor: pointer; }
    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      min-width: 180px;
      padding: 8px 0;
      display: none;
      z-index: 1001;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #666;
      font-size: 14px;
      transition: all 0.3s;
      text-decoration: none;
    }
    .dropdown-item:hover { background: #f5f7fa; color: #667eea; }
    .dropdown-divider { height: 1px; background: #f0f0f0; margin: 8px 0; }

    .main-container { max-width: 1000px; margin: 0 auto; padding: 30px; }

    .page-header {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-title-group { display: flex; align-items: center; gap: 12px; }
    .page-title { font-size: 22px; font-weight: 600; color: #333; }
    .page-desc { color: #999; font-size: 14px; margin-top: 4px; }

    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4); }

    .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06); margin-bottom: 24px; }
    .card-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

    .contact-list { display: flex; flex-direction: column; gap: 12px; }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      background: #f8f9fc;
      border-radius: 12px;
      transition: all 0.3s;
    }
    .contact-item:hover { background: #f0f2f8; }

    .contact-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .contact-info { flex: 1; }
    .contact-name { font-weight: 600; font-size: 16px; color: #333; margin-bottom: 4px; }
    .contact-meta { font-size: 13px; color: #999; display: flex; gap: 16px; }
    .contact-meta span { display: flex; align-items: center; gap: 4px; }

    .contact-actions { display: flex; gap: 8px; }

    .btn-delete {
      padding: 8px 16px;
      background: #fff;
      color: #ff4d4f;
      border: 1px solid #ff4d4f;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-delete:hover { background: #ff4d4f; color: white; }

    .empty-state { text-align: center; padding: 60px 20px; color: #999; }
    .empty-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
    .empty-text { font-size: 16px; margin-bottom: 8px; }
    .empty-hint { font-size: 14px; }

    .form-item { margin-bottom: 16px; }
    .form-label { font-size: 14px; color: #666; margin-bottom: 8px; display: block; }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e4e7ed;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.3s;
    }
    .form-input:focus { outline: none; border-color: #667eea; }
    .form-input-phone { display: flex; gap: 8px; }
    .form-input-phone .form-input { flex: 1; }
    .form-input-phone .btn-code { padding: 10px 16px; background: #f5f7fa; border: 2px solid #e4e7ed; border-radius: 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .form-input-phone .btn-code:hover { border-color: #667eea; color: #667eea; }
    .form-input-phone .btn-code:disabled { background: #e4e7ed; color: #999; cursor: not-allowed; }

    @media (max-width: 768px) {
      .navbar { padding: 0 20px; }
      .navbar-menu { display: none; }
      .main-container { padding: 20px; }
      .page-header { flex-direction: column; gap: 16px; align-items: flex-start; }
      .contact-item { flex-direction: column; align-items: flex-start; }
      .contact-meta { flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <nav class="navbar">
      <div class="navbar-logo">
        <span class="navbar-logo-icon">🌾</span>
        <span>中国农学会</span>
      </div>
      <div class="navbar-menu">
        <a href="company-home.html" class="navbar-item active">单位主页</a>
        <a href="company-notifications.html" class="navbar-item">站内通知</a>
      </div>
      <div class="navbar-user">
        <div class="user-dropdown" onclick="this.querySelector('.dropdown-menu').classList.toggle('show')">
          <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <div class="navbar-avatar">北</div>
            <span>北京智慧农业科技有限公司</span>
            <span style="font-size: 12px;">▼</span>
          </div>
          <div class="dropdown-menu">
            <a href="identity-switch.html" class="dropdown-item"><span>🔄</span><span>切换身份</span></a>
            <a href="account-settings.html" class="dropdown-item"><span>⚙️</span><span>账号设置</span></a>
            <a href="javascript:void(0)" class="dropdown-item" onclick="openFeedbackModal()"><span>💬</span><span>意见反馈</span></a>
            <div class="dropdown-divider"></div>
            <a href="login.html" class="dropdown-item"><span>🚪</span><span>退出登录</span></a>
          </div>
        </div>
      </div>
    </nav>

    <div class="main-container">
      <div class="page-header">
        <div class="page-title-group">
          <el-icon size="24" color="#667eea"><User /></el-icon>
          <div>
            <div class="page-title">其他联系人</div>
            <div class="page-desc">管理可访问本单位会员系统的其他联系人</div>
          </div>
        </div>
        <button class="btn btn-primary" @click="showAddDialog">
          <el-icon><Plus /></el-icon>
          添加联系人
        </button>
      </div>

      <div class="card">
        <div class="card-title">
          <el-icon><User /></el-icon>
          联系人列表
        </div>

        <div class="contact-list" v-if="contacts.length > 0">
          <div class="contact-item" v-for="contact in contacts" :key="contact.id">
            <div class="contact-avatar">{{ contact.name.charAt(0) }}</div>
            <div class="contact-info">
              <div class="contact-name">{{ contact.name }}</div>
              <div class="contact-meta">
                <span><el-icon><Message /></el-icon> {{ contact.phone }}</span>
                <span><el-icon><Clock /></el-icon> 添加时间：{{ contact.addTime }}</span>
              </div>
            </div>
            <div class="contact-actions">
              <button class="btn-delete" @click="handleDelete(contact)">
                <el-icon><Delete /></el-icon>
                删除
              </button>
            </div>
          </div>
        </div>

        <div class="empty-state" v-else>
          <div class="empty-icon">👥</div>
          <div class="empty-text">暂无其他联系人</div>
          <div class="empty-hint">点击上方"添加联系人"为其他人授权</div>
        </div>
      </div>

      <el-dialog v-model="dialogVisible" title="添加联系人" width="450px" :close-on-click-modal="false">
        <div class="form-item">
          <label class="form-label">手机号</label>
          <div class="form-input-phone">
            <input type="tel" class="form-input" v-model="newContact.phone" placeholder="请输入手机号" maxlength="11">
            <button class="btn-code" @click="sendCode" :disabled="codeCooldown > 0 || newContact.phone.length !== 11">
              {{ codeCooldown > 0 ? codeCooldown + 's' : '获取验证码' }}
            </button>
          </div>
        </div>
        <div class="form-item">
          <label class="form-label">姓名</label>
          <input type="text" class="form-input" v-model="newContact.name" placeholder="请输入姓名" maxlength="20">
        </div>
        <div class="form-item">
          <label class="form-label">验证码</label>
          <input type="text" class="form-input" v-model="newContact.code" placeholder="请输入验证码" maxlength="6">
        </div>
        <template #footer>
          <button class="btn btn-default" @click="dialogVisible = false" style="padding: 10px 20px; border-radius: 10px; border: 1px solid #e4e7ed; background: #f5f7fa; cursor: pointer;">取消</button>
          <button class="btn btn-primary" @click="handleAdd" style="padding: 10px 20px; border-radius: 10px; border: none; background: linear-gradient(135deg, #667eea, #764ba2); color: white; cursor: pointer;">
            <el-icon><Plus /></el-icon>
            添加
          </button>
        </template>
      </el-dialog>
    </div>
  </div>

  <script>
    const { createApp, ref, watch } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    const app = createApp({
      setup() {
        const contacts = ref([
          { id: 1, name: '王芳', phone: '138****8002', addTime: '2024-01-15' },
          { id: 2, name: '李强', phone: '139****8003', addTime: '2024-02-20' }
        ]);
        const memberNameMap = {
          '13800138002': '王芳',
          '13900138003': '李强',
          '13700138001': '张明'
        };

        const dialogVisible = ref(false);
        const newContact = ref({ name: '', phone: '', code: '' });
        const codeCooldown = ref(0);

        const showAddDialog = () => {
          newContact.value = { name: '', phone: '', code: '' };
          dialogVisible.value = true;
        };

        watch(() => newContact.value.phone, (phone) => {
          if (phone && phone.length === 11 && memberNameMap[phone]) {
            newContact.value.name = memberNameMap[phone];
          }
        });

        const sendCode = () => {
          if (newContact.value.phone.length !== 11) {
            ElMessage.warning('请输入正确的手机号');
            return;
          }
          codeCooldown.value = 60;
          const timer = setInterval(() => {
            codeCooldown.value--;
            if (codeCooldown.value <= 0) {
              clearInterval(timer);
            }
          }, 1000);
          ElMessage.success('验证码已发送');
        };

        const handleAdd = () => {
          if (!newContact.value.name || !newContact.value.name.trim()) {
            ElMessage.warning('请输入姓名');
            return;
          }
          if (!newContact.value.phone || newContact.value.phone.length !== 11) {
            ElMessage.warning('请输入正确的手机号');
            return;
          }
          if (!newContact.value.code || newContact.value.code.length !== 6) {
            ElMessage.warning('请输入6位验证码');
            return;
          }
          const newId = Math.max(...contacts.value.map(c => c.id)) + 1;
          contacts.value.push({
            id: newId,
            name: newContact.value.name.trim(),
            phone: newContact.value.phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2'),
            addTime: new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')
          });
          dialogVisible.value = false;
          ElMessage.success('添加成功');
        };

        const handleDelete = (contact) => {
          ElMessageBox.confirm('确定要删除该联系人吗？删除后该用户将无法访问本单位会员系统。', '提示', {
            confirmButtonText: '确定',
            cancelButtonText: '取消',
            type: 'warning'
          }).then(() => {
            const index = contacts.value.findIndex(c => c.id === contact.id);
            if (index > -1) {
              contacts.value.splice(index, 1);
              ElMessage.success('删除成功');
            }
          });
        };

        return {
          contacts,
          dialogVisible,
          newContact,
          codeCooldown,
          showAddDialog,
          sendCode,
          handleAdd,
          handleDelete
        };
      }
    });

    app.use(ElementPlus);
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
      app.component(key, component);
    }
    app.mount('#app');
  </script>
</body>
</html>
