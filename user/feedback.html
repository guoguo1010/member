<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>意见反馈 - 中国农学会</title>
  <link rel="stylesheet" href="../css/web.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%); min-height: 100vh; }

    .navbar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 0 40px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .navbar-logo { display: flex; align-items: center; gap: 12px; color: white; font-size: 20px; font-weight: 600; }
    .navbar-logo-icon { font-size: 32px; }
    .navbar-menu { display: flex; gap: 4px; }
    .navbar-item { padding: 10px 20px; color: rgba(255, 255, 255, 0.9); text-decoration: none; border-radius: 8px; transition: all 0.3s; font-size: 15px; }
    .navbar-item:hover { background: rgba(255, 255, 255, 0.2); color: white; }
    .navbar-item.active { background: rgba(255, 255, 255, 0.3); color: white; }
    .navbar-user { display: flex; align-items: center; gap: 16px; color: white; }
    .navbar-avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: all 0.3s; }
    .navbar-avatar:hover { transform: scale(1.1); }

    .user-dropdown { position: relative; cursor: pointer; }
    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      min-width: 180px;
      padding: 8px 0;
      display: none;
      z-index: 1001;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #666;
      font-size: 14px;
      transition: all 0.3s;
      text-decoration: none;
    }
    .dropdown-item:hover { background: #f5f7fa; color: #667eea; }
    .dropdown-divider { height: 1px; background: #f0f0f0; margin: 8px 0; }

    .page-container { max-width: 800px; margin: 0 auto; padding: 40px 24px; }

    .page-header {
      margin-bottom: 32px;
    }
    .page-title {
      font-size: 24px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }
    .page-desc {
      font-size: 14px;
      color: #666;
    }

    .feedback-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      padding: 32px;
    }

    .form-group {
      margin-bottom: 24px;
    }
    .form-group:last-child { margin-bottom: 0; }
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 8px;
    }
    .form-label .required { color: #ff4d4f; margin-left: 4px; }
    .form-input, .form-textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e4e7ed;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.3s;
      background: #f8f9fc;
    }
    .form-input:focus, .form-textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      background: white;
    }
    .form-textarea {
      min-height: 160px;
      resize: vertical;
      line-height: 1.6;
    }
    .textarea-wrapper {
      position: relative;
    }
    .textarea-counter {
      position: absolute;
      bottom: 12px;
      right: 12px;
      font-size: 12px;
      color: #999;
      pointer-events: none;
    }
    .form-hint {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
    }

    .type-select {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .type-option {
      padding: 10px 20px;
      border: 1px solid #e4e7ed;
      border-radius: 8px;
      font-size: 14px;
      color: #666;
      cursor: pointer;
      transition: all 0.3s;
      background: #f8f9fc;
    }
    .type-option:hover { border-color: #764ba2; color: #667eea; }
    .type-option.active {
      border-color: #667eea;
      background: rgba(102, 126, 234, 0.08);
      color: #667eea;
    }

    .btn {
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
    }
    .btn-lg { padding: 14px 32px; font-size: 15px; }

    .form-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #f0f0f0;
    }
  </style>
</head>
<body>
  <div id="app">
    <nav class="navbar">
      <div class="navbar-logo">
        <span class="navbar-logo-icon">🌾</span>
        <span>中国农学会</span>
      </div>
      <div class="navbar-menu">
        <a href="personal-center.html" class="navbar-item">首页</a>
        <a href="data-stats.html" class="navbar-item">数说学会</a>
        <a href="personal-info.html" class="navbar-item">会员信息</a>
        <a href="payment.html" class="navbar-item">缴费订单</a>
        <a href="messages.html" class="navbar-item">我的消息</a>
        <a href="growth-trajectory.html" class="navbar-item">成长轨迹</a>
      </div>
      <div class="navbar-user">
        <div class="navbar-avatar" style="cursor: pointer;" onclick="location.href='messages.html'">🔔</div>
        <div class="user-dropdown" onclick="this.querySelector('.dropdown-menu').classList.toggle('show')">
          <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <div class="navbar-avatar">张</div>
            <span>张三</span>
            <span style="font-size: 12px;">▼</span>
          </div>
          <div class="dropdown-menu">
            <a href="identity-switch.html" class="dropdown-item">
              <span>🔄</span>
              <span>切换身份</span>
            </a>
            <a href="account-settings.html" class="dropdown-item">
              <span>⚙️</span>
              <span>账号设置</span>
            </a>
            <a href="feedback.html" class="dropdown-item">
              <span>💬</span>
              <span>意见反馈</span>
            </a>
            <div class="dropdown-divider"></div>
            <a href="login.html" class="dropdown-item">
              <span>🚪</span>
              <span>退出登录</span>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <div class="page-container">
      <div class="page-header">
        <h1 class="page-title">意见反馈</h1>
        <p class="page-desc">我们非常重视您的意见和建议，请留下您的问题或建议，我们会尽快处理并回复</p>
      </div>

      <div class="feedback-card">
        <div class="form-group">
          <label class="form-label">反馈类型</label>
          <div class="type-select">
            <div class="type-option active" data-type="society" onclick="selectType(this)">🏛️ 学会建议</div>
            <div class="type-option" data-type="system" onclick="selectType(this)">⚙️ 系统建议</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">反馈内容 <span class="required">*</span></label>
          <div class="textarea-wrapper">
            <textarea class="form-textarea" id="feedbackContent" placeholder="请详细描述您的问题或建议..." maxlength="500" oninput="updateCharCount()"></textarea>
            <span class="textarea-counter"><span id="charCount">0</span>/500</span>
          </div>
          <div class="form-hint">请尽量详细描述您的问题或建议，便于我们更好地为您服务</div>
        </div>

        <div class="form-actions">
          <button class="btn btn-default btn-lg" onclick="resetForm()">重置</button>
          <button class="btn btn-primary btn-lg" onclick="submitFeedback()">提交反馈</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    var selectedFeedbackType = 'society';

    function selectType(el) {
      document.querySelectorAll('.type-option').forEach(item => item.classList.remove('active'));
      el.classList.add('active');
      selectedFeedbackType = el.dataset.type;
    }

    function updateCharCount() {
      var content = document.getElementById('feedbackContent').value;
      document.getElementById('charCount').textContent = content.length;
    }

    function submitFeedback() {
      var content = document.getElementById('feedbackContent').value.trim();
      if (!content) {
        alert('请输入反馈内容');
        return;
      }

      // 模拟提交
      alert('反馈已提交，我们会尽快处理并回复您！');
      resetForm();
    }

    function resetForm() {
      document.getElementById('feedbackContent').value = '';
      document.querySelectorAll('.type-option').forEach(item => item.classList.remove('active'));
      document.querySelector('.type-option[data-type="society"]').classList.add('active');
    }
  </script>
</body>
</html>
