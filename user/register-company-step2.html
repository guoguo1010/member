<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册单位会员 - 单位信息 - 中国农学会</title>
  <link rel="stylesheet" href="../css/web.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%); min-height: 100vh; }

    .navbar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 0 40px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .navbar-logo { display: flex; align-items: center; gap: 12px; color: white; font-size: 20px; font-weight: 600; }
    .navbar-logo-icon { font-size: 32px; }
    .navbar-menu { display: flex; gap: 4px; }
    .navbar-item { padding: 10px 20px; color: rgba(255, 255, 255, 0.9); text-decoration: none; border-radius: 8px; transition: all 0.3s; font-size: 15px; }
    .navbar-item:hover { background: rgba(255, 255, 255, 0.2); color: white; }
    .navbar-item.active { background: rgba(255, 255, 255, 0.3); color: white; }
    .navbar-user { display: flex; align-items: center; gap: 16px; color: white; }
    .navbar-avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: all 0.3s; }
    .navbar-avatar:hover { transform: scale(1.1); }

    .user-dropdown { position: relative; cursor: pointer; }
    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      min-width: 180px;
      padding: 8px 0;
      display: none;
      z-index: 1001;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #666;
      font-size: 14px;
      transition: all 0.3s;
      text-decoration: none;
    }
    .dropdown-item:hover { background: #f5f7fa; color: #667eea; }
    .dropdown-divider { height: 1px; background: #f0f0f0; margin: 8px 0; }

    .register-container { max-width: 1000px; margin: 0 auto; padding: 40px 24px; }

    .step-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
      padding: 0 20px;
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .step-item .step-num {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(102, 126, 234, 0.1);
      border: 2px solid rgba(102, 126, 234, 0.2);
      color: #999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s;
    }
    .step-item.active .step-num {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: #667eea;
      color: #fff;
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
    }
    .step-item.completed .step-num {
      background: linear-gradient(135deg, #52c41a, #73d13d);
      border-color: #52c41a;
      color: #fff;
      box-shadow: 0 4px 16px rgba(82, 196, 26, 0.4);
    }
    .step-item .step-label {
      margin-top: 10px;
      font-size: 13px;
      color: #999;
      font-weight: 500;
      white-space: nowrap;
    }
    .step-item.active .step-label { color: #667eea; font-weight: 600; }
    .step-item.completed .step-label { color: #52c41a; }
    .step-line {
      flex: 1;
      height: 3px;
      background: rgba(102, 126, 234, 0.1);
      margin: 0 -10px;
      margin-top: -20px;
      border-radius: 2px;
      max-width: 120px;
    }
    .step-line.filled { background: linear-gradient(90deg, #52c41a, #73d13d); }

    .form-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      padding: 32px;
      margin-bottom: 24px;
    }

    .form-section { margin-bottom: 28px; }
    .form-section:last-child { margin-bottom: 0; }

    .form-section-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(102, 126, 234, 0.1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-section-title::before {
      content: '';
      width: 4px;
      height: 18px;
      background: linear-gradient(180deg, #667eea, #764ba2);
      border-radius: 2px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }
    .form-row.single { grid-template-columns: 1fr; }
    .form-row:last-child { margin-bottom: 0; }

    .form-group { margin-bottom: 0; }
    .form-group:last-child { margin-bottom: 0; }

    .form-label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-label .required { color: #ff4d4f; margin-left: 2px; }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e4e7ed;
      border-radius: 8px;
      font-size: 14px;
      color: #333;
      background: #fff;
      transition: all 0.3s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      outline: none;
    }
    .form-input::placeholder { color: #c0c4cc; }
    .form-textarea { resize: vertical; min-height: 80px; }

    .form-select-search {
      position: relative;
    }
    .form-select-search .select-trigger {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e4e7ed;
      border-radius: 8px;
      font-size: 14px;
      color: #333;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s;
    }
    .form-select-search .select-trigger:hover { border-color: #667eea; }
    .form-select-search.open .select-trigger {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      border-radius: 8px 8px 0 0;
    }
    .form-select-search .select-trigger .placeholder { color: #c0c4cc; }
    .form-select-search .select-trigger .arrow { font-size: 10px; color: #999; transition: transform 0.3s; }
    .form-select-search.open .select-trigger .arrow { transform: rotate(180deg); }
    .form-select-search .select-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #667eea;
      border-top: none;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.15);
      z-index: 100;
      display: none;
      max-height: 280px;
      overflow: hidden;
    }
    .form-select-search.open .select-dropdown { display: block; }
    .form-select-search .select-search {
      padding: 10px;
      border-bottom: 1px solid #f0f0f0;
    }
    .form-select-search .select-search input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e4e7ed;
      border-radius: 6px;
      font-size: 13px;
    }
    .form-select-search .select-search input:focus {
      border-color: #667eea;
      outline: none;
    }
    .form-select-search .select-options {
      max-height: 220px;
      overflow-y: auto;
    }
    .form-select-search .select-option {
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .form-select-search .select-option:hover { background: rgba(102, 126, 234, 0.06); }
    .form-select-search .select-option.selected { background: rgba(102, 126, 234, 0.1); color: #667eea; }
    .form-select-search .select-option .option-name { font-weight: 500; }
    .form-select-search .select-option .option-type { font-size: 12px; color: #999; margin-left: 8px; }
    .form-select-search .select-empty {
      padding: 20px;
      text-align: center;
      color: #999;
      font-size: 13px;
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
      border-top: 1px solid #f0f0f0;
      margin-top: 8px;
    }

    .btn {
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
    }
    .btn-default {
      background: #f5f7fa;
      color: #666;
      border: 1px solid #e4e7ed;
    }
    .btn-default:hover { background: #e4e7ed; }
    .btn-lg { padding: 14px 32px; font-size: 15px; }
  </style>
</head>
<body>
  <div id="app">
    <nav class="navbar">
      <div class="navbar-logo">
        <span class="navbar-logo-icon">🌾</span>
        <span>中国农学会</span>
      </div>
      <div class="navbar-menu">
        <a href="personal-center.html" class="navbar-item">首页</a>
        <a href="data-stats.html" class="navbar-item">数说学会</a>
        <a href="personal-info.html" class="navbar-item">会员信息</a>
        <a href="payment.html" class="navbar-item">缴费订单</a>
        <a href="messages.html" class="navbar-item">我的消息</a>
        <a href="growth-trajectory.html" class="navbar-item">成长轨迹</a>
      </div>
      <div class="navbar-user">
        <div class="navbar-avatar" style="cursor: pointer;" onclick="location.href='messages.html'">🔔</div>
        <div class="user-dropdown" onclick="this.querySelector('.dropdown-menu').classList.toggle('show')">
          <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <div class="navbar-avatar">张</div>
            <span>张三</span>
            <span style="font-size: 12px;">▼</span>
          </div>
          <div class="dropdown-menu">
            <a href="identity-switch.html" class="dropdown-item">
              <span>🔄</span>
              <span>切换身份</span>
            </a>
            <a href="account-settings.html" class="dropdown-item">
              <span>⚙️</span>
              <span>账号设置</span>
            </a>
            <div class="dropdown-divider"></div>
            <a href="login.html" class="dropdown-item">
              <span>🚪</span>
              <span>退出登录</span>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <div class="register-container">
      <div class="step-bar">
        <div class="step-item completed" id="step1">
          <div class="step-num">✓</div>
          <div class="step-label">选择类型</div>
        </div>
        <div class="step-line filled"></div>
        <div class="step-item active" id="step2">
          <div class="step-num">2</div>
          <div class="step-label">单位信息</div>
        </div>
        <div class="step-line"></div>
        <div class="step-item" id="step3">
          <div class="step-num">3</div>
          <div class="step-label">联系人</div>
        </div>
        <div class="step-line"></div>
        <div class="step-item" id="step4">
          <div class="step-num">4</div>
          <div class="step-label">确认提交</div>
        </div>
      </div>

      <div class="form-card">
        <div class="form-section">
          <div class="form-section-title">单位基本信息</div>
          <div class="form-row single">
            <div class="form-group">
              <label class="form-label">发展来源 <span class="required">*</span></label>
              <div class="form-select-search" id="orgSelect">
                <div class="select-trigger" onclick="toggleOrgSelect()">
                  <span class="placeholder">请选择发展来源机构</span>
                  <span class="arrow">▼</span>
                </div>
                <div class="select-dropdown">
                  <div class="select-search">
                    <input type="text" placeholder="搜索机构名称..." oninput="filterOrgOptions(this.value)">
                  </div>
                  <div class="select-options"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="form-row single">
            <div class="form-group">
              <label class="form-label">单位名称 <span class="required">*</span></label>
              <input type="text" class="form-input" id="companyName" placeholder="请输入单位全称">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">单位类别 <span class="required">*</span></label>
              <select class="form-select" id="companyType">
                <option value="企业">企业</option>
                <option value="事业单位">事业单位</option>
                <option value="社会组织">社会组织</option>
                <option value="科研院所">科研院所</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">所属行业</label>
              <input type="text" class="form-input" id="industry" placeholder="请输入所属行业">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">所在地区 <span class="required">*</span></label>
              <input type="text" class="form-input" id="region" placeholder="请输入省市区">
            </div>
            <div class="form-group">
              <label class="form-label">通讯地址 <span class="required">*</span></label>
              <input type="text" class="form-input" id="address" placeholder="请输入详细地址">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">单位logo</label>
              <input type="file" class="form-input" id="companyLogo" accept=".jpg,.jpeg,.png" style="padding: 8px;">
            </div>
            <div class="form-group">
              <label class="form-label">单位网址</label>
              <input type="text" class="form-input" id="website" placeholder="如：www.example.com">
            </div>
          </div>
          <div class="form-row single">
            <div class="form-group">
              <label class="form-label">单位简介</label>
              <textarea class="form-textarea" id="description" rows="3" placeholder="请输入单位简介"></textarea>
            </div>
          </div>
          <div class="form-row single">
            <div class="form-group">
              <label class="form-label">感兴趣的分支机构</label>
              <div class="form-select-search" id="interestBranchSelect">
                <div class="select-trigger" onclick="toggleInterestBranchSelect()">
                  <span class="placeholder">请选择感兴趣的分支机构</span>
                  <span class="arrow">▼</span>
                </div>
                <div class="select-dropdown">
                  <div class="select-search">
                    <input type="text" placeholder="搜索机构名称..." oninput="filterInterestBranchOptions(this.value)">
                  </div>
                  <div class="select-options"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">单位信息（如为高校二级学院，请填写高校本级信息）</div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">成立时间</label>
              <input type="date" class="form-input" id="foundedDate">
            </div>
            <div class="form-group">
              <label class="form-label">注册资金</label>
              <input type="text" class="form-input" id="capital" placeholder="请输入注册资金">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">法定代表人</label>
              <input type="text" class="form-input" id="legalPerson" placeholder="请输入法定代表人">
            </div>
            <div class="form-group">
              <label class="form-label">社会统一信用代码 <span class="required">*</span></label>
              <input type="text" class="form-input" id="creditCode" placeholder="请输入信用代码">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">职工人数</label>
              <input type="text" class="form-input" id="employeeCount" placeholder="请输入职工人数">
            </div>
            <div class="form-group">
              <label class="form-label">产业规模（万元）</label>
              <input type="text" class="form-input" id="industryScale" placeholder="请输入产业规模">
            </div>
          </div>
          <div class="form-row single">
            <div class="form-group">
              <label class="form-label">营业执照</label>
              <input type="file" class="form-input" id="businessLicense" accept=".jpg,.jpeg,.png,.pdf" style="padding: 8px;">
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-default btn-lg" onclick="goPrev()"><span style="margin-right: 4px;">←</span> 上一步</button>
          <div style="display: flex; gap: 12px;">
            <button class="btn btn-default btn-lg" onclick="saveOnly()">保存</button>
            <button class="btn btn-primary btn-lg" onclick="goNext()">下一步 <span style="margin-left: 4px;">→</span></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    var selectedOrgId = localStorage.getItem('reg_company_org_id') || '';
    var selectedOrgName = localStorage.getItem('reg_company_org_name') || '';
    var selectedInterestBranchId = localStorage.getItem('reg_company_interest_branch_id') || '';
    var selectedInterestBranchName = localStorage.getItem('reg_company_interest_branch_name') || '';

    var interestBranchData = [
      { id: 9, name: '作物学专业委员会', type: '专业委员会' },
      { id: 10, name: '园艺学专业委员会', type: '专业委员会' },
      { id: 11, name: '植物保护专业委员会', type: '专业委员会' },
      { id: 12, name: '土壤学专业委员会', type: '专业委员会' },
      { id: 13, name: '秘书处', type: '分支机构' },
      { id: 14, name: '学术交流部', type: '分支机构' },
      { id: 15, name: '会员服务部', type: '分支机构' }
    ];

    var orgData = [
      { id: 1, name: '北京市农学会', type: '省级学会' },
      { id: 2, name: '山东省农学会', type: '省级学会' },
      { id: 3, name: '江苏省农学会', type: '省级学会' },
      { id: 4, name: '浙江省农学会', type: '省级学会' },
      { id: 5, name: '广东省农学会', type: '省级学会' },
      { id: 6, name: '杭州市农学会', type: '市级学会' },
      { id: 7, name: '南京市农学会', type: '市级学会' },
      { id: 8, name: '广州市农学会', type: '市级学会' },
      { id: 9, name: '作物学专业委员会', type: '专业委员会' },
      { id: 10, name: '园艺学专业委员会', type: '专业委员会' },
      { id: 11, name: '植物保护专业委员会', type: '专业委员会' },
      { id: 12, name: '土壤学专业委员会', type: '专业委员会' },
      { id: 13, name: '秘书处', type: '分支机构' },
      { id: 14, name: '学术交流部', type: '分支机构' },
      { id: 15, name: '会员服务部', type: '分支机构' }
    ];

    function toggleOrgSelect() {
      var el = document.getElementById('orgSelect');
      var isOpen = el.classList.contains('open');
      if (isOpen) {
        el.classList.remove('open');
      } else {
        document.querySelectorAll('.form-select-search.open').forEach(function(openEl) {
          openEl.classList.remove('open');
        });
        el.classList.add('open');
        renderOrgOptions(orgData);
        el.querySelector('.select-search input').focus();
      }
    }
    function toggleInterestBranchSelect() {
      var el = document.getElementById('interestBranchSelect');
      var isOpen = el.classList.contains('open');
      if (isOpen) {
        el.classList.remove('open');
      } else {
        document.querySelectorAll('.form-select-search.open').forEach(function(openEl) {
          openEl.classList.remove('open');
        });
        el.classList.add('open');
        renderInterestBranchOptions(interestBranchData);
        el.querySelector('.select-search input').focus();
      }
    }

    function renderInterestBranchOptions(data) {
      var container = document.querySelector('#interestBranchSelect .select-options');
      if (data.length === 0) {
        container.innerHTML = '<div class="select-empty">暂无匹配结果</div>';
        return;
      }
      container.innerHTML = data.map(function(org) {
        var isSelected = org.id == selectedInterestBranchId;
        return '<div class="select-option' + (isSelected ? ' selected' : '') + '" data-id="' + org.id + '" data-name="' + org.name + '" data-type="' + org.type + '" onclick="selectInterestBranch(this.dataset.id, this.dataset.name, this.dataset.type)">' +
          '<span class="option-name">' + org.name + '</span>' +
          '<span class="option-type">' + org.type + '</span>' +
        '</div>';
      }).join('');
    }

    function filterInterestBranchOptions(keyword) {
      var filtered = interestBranchData.filter(function(org) {
        return org.name.indexOf(keyword) !== -1 || org.type.indexOf(keyword) !== -1;
      });
      renderInterestBranchOptions(filtered);
    }

    function selectInterestBranch(id, name, type) {
      selectedInterestBranchId = id;
      selectedInterestBranchName = name;
      var trigger = document.querySelector('#interestBranchSelect .select-trigger');
      trigger.innerHTML = '<span class="option-name">' + name + '</span><span class="option-type">' + type + '</span><span class="arrow">▼</span>';
      document.getElementById('interestBranchSelect').classList.remove('open');
    }


    function renderOrgOptions(data) {
      var container = document.querySelector('#orgSelect .select-options');
      if (data.length === 0) {
        container.innerHTML = '<div class="select-empty">暂无匹配结果</div>';
        return;
      }
      container.innerHTML = data.map(function(org) {
        var isSelected = org.id == selectedOrgId;
        return '<div class="select-option' + (isSelected ? ' selected' : '') + '" data-id="' + org.id + '" onclick="selectOrg(\'' + org.id + '\', \'' + org.name + '\', \'' + org.type + '\')">' +
          '<span class="option-name">' + org.name + '</span>' +
          '<span class="option-type">' + org.type + '</span>' +
        '</div>';
      }).join('');
    }

    function filterOrgOptions(keyword) {
      var filtered = orgData.filter(function(org) {
        return org.name.indexOf(keyword) !== -1 || org.type.indexOf(keyword) !== -1;
      });
      renderOrgOptions(filtered);
    }

    function selectOrg(id, name, type) {
      selectedOrgId = id;
      selectedOrgName = name;
      var trigger = document.querySelector('#orgSelect .select-trigger');
      trigger.innerHTML = '<span class="option-name">' + name + '</span><span class="option-type">' + type + '</span><span class="arrow">▼</span>';
      document.getElementById('orgSelect').classList.remove('open');
    }

    document.addEventListener('click', function(e) {
      var orgSelect = document.getElementById('orgSelect');
      var interestBranchSelect = document.getElementById('interestBranchSelect');
      if (!orgSelect.contains(e.target)) {
        orgSelect.classList.remove('open');
      }
      if (!interestBranchSelect.contains(e.target)) {
        interestBranchSelect.classList.remove('open');
      }
    });

    function init() {
      var data = JSON.parse(localStorage.getItem('reg_company_step2') || '{}');
      if (selectedOrgId && selectedOrgName) {
        var org = orgData.find(function(o) { return o.id == selectedOrgId; });
        if (org) {
          var trigger = document.querySelector('#orgSelect .select-trigger');
          trigger.innerHTML = '<span class="option-name">' + org.name + '</span><span class="option-type">' + org.type + '</span><span class="arrow">▼</span>';
        }
      }
      if (selectedInterestBranchId && selectedInterestBranchName) {
        var branch = interestBranchData.find(function(o) { return o.id == selectedInterestBranchId; });
        if (branch) {
          var interestTrigger = document.querySelector('#interestBranchSelect .select-trigger');
          interestTrigger.innerHTML = '<span class="option-name">' + branch.name + '</span><span class="option-type">' + branch.type + '</span><span class="arrow">▼</span>';
        }
      }
      if (data.companyName) document.getElementById('companyName').value = data.companyName;
      if (data.companyType) document.getElementById('companyType').value = data.companyType;
      if (data.industry) document.getElementById('industry').value = data.industry;
      if (data.region) document.getElementById('region').value = data.region;
      if (data.address) document.getElementById('address').value = data.address;
      if (data.website) document.getElementById('website').value = data.website;
      if (data.creditCode) document.getElementById('creditCode').value = data.creditCode;
      if (data.foundedDate) document.getElementById('foundedDate').value = data.foundedDate;
      if (data.capital) document.getElementById('capital').value = data.capital;
      if (data.legalPerson) document.getElementById('legalPerson').value = data.legalPerson;
      if (data.employeeCount) document.getElementById('employeeCount').value = data.employeeCount;
      if (data.description) document.getElementById('description').value = data.description;
      if (data.industryScale) document.getElementById('industryScale').value = data.industryScale;
    }

    function saveData() {
      localStorage.setItem('reg_company_org_id', selectedOrgId);
      localStorage.setItem('reg_company_org_name', selectedOrgName);
      localStorage.setItem('reg_company_interest_branch_id', selectedInterestBranchId);
      localStorage.setItem('reg_company_interest_branch_name', selectedInterestBranchName);
      var data = {
        companyName: document.getElementById('companyName').value,
        companyType: document.getElementById('companyType').value,
        industry: document.getElementById('industry').value,
        region: document.getElementById('region').value,
        address: document.getElementById('address').value,
        website: document.getElementById('website').value,
        creditCode: document.getElementById('creditCode').value,
        foundedDate: document.getElementById('foundedDate').value,
        capital: document.getElementById('capital').value,
        legalPerson: document.getElementById('legalPerson').value,
        employeeCount: document.getElementById('employeeCount').value,
        description: document.getElementById('description').value,
        industryScale: document.getElementById('industryScale').value,
        companyLogo: document.getElementById('companyLogo').value,
        businessLicense: document.getElementById('businessLicense').value,
        interestBranchId: selectedInterestBranchId,
        interestBranchName: selectedInterestBranchName
      };
      localStorage.setItem('reg_company_step2', JSON.stringify(data));
    }

    function saveOnly() {
      saveData();
      showToast('保存成功');
    }

    function goPrev() {
      saveData();
      location.href = 'register-company-type.html';
    }

    function goNext() {
      saveData();
      location.href = 'register-company-step3.html';
    }

    init();
  </script>
</body>
</html>
