<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信息变更 - 中国农学会</title>
    <link rel="stylesheet" href="../css/web.css">
    <script src="../js/vue.global.js"></script>
    <script src="../js/element-plus.js"></script>
    <script src="../js/icons-vue.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 0 40px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-size: 20px;
            font-weight: 600;
        }

        .navbar-logo-icon { font-size: 32px; }

        .navbar-menu { display: flex; gap: 8px; }

        .navbar-item {
            padding: 10px 20px;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 15px;
        }

        .navbar-item:hover { background: rgba(255, 255, 255, 0.2); }

        .navbar-item.active { background: rgba(255, 255, 255, 0.3); color: white; }

        .navbar-user { display: flex; align-items: center; gap: 16px; color: white; }

        .navbar-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .navbar-avatar:hover { transform: scale(1.1); }

        .user-dropdown { position: relative; cursor: pointer; }
        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            min-width: 180px;
            padding: 8px 0;
            display: none;
            z-index: 1001;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
        }
        .dropdown-item:hover { background: #f5f7fa; color: #667eea; }
        .dropdown-divider { height: 1px; background: #f0f0f0; margin: 8px 0; }

        .main-container { max-width: 1000px; margin: 0 auto; padding: 30px; }

        .page-header {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-desc { color: #999; font-size: 14px; margin-top: 4px; }

        .form-card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .form-section {
            margin-bottom: 32px;
        }
        .form-section:last-child { margin-bottom: 0; }

        .form-section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: linear-gradient(180deg, #667eea, #764ba2);
            border-radius: 2px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 16px;
        }
        .form-row.single { grid-template-columns: 1fr; }
        .form-row:last-child { margin-bottom: 0; }

        .form-group { margin-bottom: 0; }
        .form-group:last-child { margin-bottom: 0; }

        .form-label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-label .required { color: #ff4d4f; margin-left: 2px; }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e4e7ed;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            background: #fff;
            transition: all 0.3s;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }
        .form-input:disabled, .form-select:disabled {
            background: #f5f7fa;
            color: #999;
            cursor: not-allowed;
        }
        .form-input::placeholder, .form-textarea::placeholder { color: #c0c4cc; }
        .form-textarea { resize: vertical; min-height: 80px; }

        .readonly-box {
            background: #f5f7fa;
            border: 1px solid #e4e7ed;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            color: #999;
        }

        .action-bar {
            display: flex;
            gap: 12px;
            justify-content: center;
            padding-top: 32px;
            border-top: 2px solid #f0f0f0;
            margin-top: 32px;
        }

        .btn {
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .btn-default {
            background: #f5f7fa;
            color: #666;
            border: 1px solid #e4e7ed;
        }

        .btn-default:hover { background: #e4e7ed; }

        .tip-box {
            background: rgba(102, 126, 234, 0.04);
            border: 1px solid rgba(102, 126, 234, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .tip-box::before { content: '💡'; font-size: 16px; }

        @media (max-width: 768px) {
            .navbar { padding: 0 20px; }
            .navbar-menu { display: none; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div class="navbar-logo">
                <span class="navbar-logo-icon">🌾</span>
                <span>中国农学会</span>
            </div>
            <div class="navbar-menu">
                <a href="personal-center.html" class="navbar-item">首页</a>
                <a href="data-stats.html" class="navbar-item">数说学会</a>
                <a href="personal-info.html" class="navbar-item active">会员信息</a>
                <a href="payment.html" class="navbar-item">缴费订单</a>
                <a href="messages.html" class="navbar-item">我的消息</a>
                <a href="growth-trajectory.html" class="navbar-item">成长轨迹</a>
            </div>
            <div class="navbar-user">
                <el-badge :value="3" class="item">
                    <div class="navbar-avatar">🔔</div>
                </el-badge>
                <div class="user-dropdown" onclick="this.querySelector('.dropdown-menu').classList.toggle('show')">
                    <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <div class="navbar-avatar">张</div>
                        <span>张三</span>
                        <span style="font-size: 12px;">▼</span>
                    </div>
                    <div class="dropdown-menu">
                        <a href="identity-switch.html" class="dropdown-item">
                            <span>🔄</span>
                            <span>切换身份</span>
                        </a>
                        <a href="account-settings.html" class="dropdown-item">
                            <span>⚙️</span>
                            <span>账号设置</span>
                        </a>
                        <div class="dropdown-divider"></div>
                        <a href="login.html" class="dropdown-item">
                            <span>🚪</span>
                            <span>退出登录</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="main-container">
            <div class="page-header">
                <div>
                    <div class="page-title">
                        <el-icon><Edit /></el-icon>
                        信息变更
                    </div>
                    <div class="page-desc">修改您的会员信息（带 * 为必填项）</div>
                </div>
            </div>

            <div class="form-card">
                <div class="tip-box">
                    以下三项为不可变更信息：会员类型、缴费方式、发展来源机构。如需变更请联系管理员。
                </div>

                <div class="form-section">
                    <div class="form-section-title">会员类型</div>
                    <div class="form-row single">
                        <div class="form-group">
                            <label class="form-label">会员类型</label>
                            <div class="readonly-box">普通个人会员</div>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">缴费方式</div>
                    <div class="form-row single">
                        <div class="form-group">
                            <label class="form-label">缴费方式</label>
                            <div class="readonly-box">1年 - ¥100</div>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">发展来源机构</div>
                    <div class="form-row single">
                        <div class="form-group">
                            <label class="form-label">发展机构</label>
                            <div class="readonly-box">北京市农学会</div>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">基本信息</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">真实姓名 <span class="required">*</span></label>
                            <input type="text" class="form-input" v-model="formData.realName" placeholder="请输入真实姓名">
                        </div>
                        <div class="form-group">
                            <label class="form-label">性别 <span class="required">*</span></label>
                            <select class="form-select" v-model="formData.gender">
                                <option value="男">男</option>
                                <option value="女">女</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">出生日期</label>
                            <input type="date" class="form-input" v-model="formData.birthDate">
                        </div>
                        <div class="form-group">
                            <label class="form-label">民族</label>
                            <select class="form-select" v-model="formData.ethnicity">
                                <option value="汉族">汉族</option>
                                <option value="蒙古族">蒙古族</option>
                                <option value="回族">回族</option>
                                <option value="藏族">藏族</option>
                                <option value="维吾尔族">维吾尔族</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">身份证号 <span class="required">*</span></label>
                            <input type="text" class="form-input" v-model="formData.idCard" placeholder="请输入身份证号">
                        </div>
                        <div class="form-group">
                            <label class="form-label">政治面貌</label>
                            <select class="form-select" v-model="formData.politicalStatus">
                                <option value="群众">群众</option>
                                <option value="中共党员">中共党员</option>
                                <option value="共青团员">共青团员</option>
                                <option value="民主党派">民主党派</option>
                                <option value="无党派人士">无党派人士</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row single">
                        <div class="form-group">
                            <label class="form-label">所在地区 <span class="required">*</span></label>
                            <input type="text" class="form-input" v-model="formData.region" placeholder="请输入省市区">
                        </div>
                    </div>
                    <div class="form-row single">
                        <div class="form-group">
                            <label class="form-label">通讯地址</label>
                            <input type="text" class="form-input" v-model="formData.address" placeholder="请输入详细地址">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">手机号 <span class="required">*</span></label>
                            <input type="text" class="form-input" v-model="formData.phone" placeholder="请输入手机号">
                        </div>
                        <div class="form-group">
                            <label class="form-label">邮箱</label>
                            <input type="email" class="form-input" v-model="formData.email" placeholder="请输入邮箱">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">国籍</label>
                            <select class="form-select" v-model="formData.nationality">
                                <option value="中国">中国</option>
                                <option value="美国">美国</option>
                                <option value="英国">英国</option>
                                <option value="日本">日本</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">籍贯</label>
                            <input type="text" class="form-input" v-model="formData.birthplace" placeholder="请输入籍贯">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">学历信息</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">最高学历</label>
                            <select class="form-select" v-model="formData.education">
                                <option value="博士研究生">博士研究生</option>
                                <option value="硕士研究生">硕士研究生</option>
                                <option value="大学本科">大学本科</option>
                                <option value="大学专科">大学专科</option>
                                <option value="中等学校">中等学校</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">毕业院校</label>
                            <input type="text" class="form-input" v-model="formData.gradSchool" placeholder="请输入毕业院校">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">专业</label>
                            <input type="text" class="form-input" v-model="formData.major" placeholder="请输入专业">
                        </div>
                        <div class="form-group">
                            <label class="form-label">国内最后学历</label>
                            <select class="form-select" v-model="formData.finalEducation">
                                <option value="">请选择</option>
                                <option value="博士研究生">博士研究生</option>
                                <option value="硕士研究生">硕士研究生</option>
                                <option value="大学本科">大学本科</option>
                                <option value="大学专科">大学专科</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">工作信息</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">职称/身份</label>
                            <select class="form-select" v-model="formData.title">
                                <option value="研究员">研究员</option>
                                <option value="副研究员">副研究员</option>
                                <option value="助理研究员">助理研究员</option>
                                <option value="教授">教授</option>
                                <option value="副教授">副教授</option>
                                <option value="讲师">讲师</option>
                                <option value="学生">学生</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">工作状态</label>
                            <select class="form-select" v-model="formData.workStatus">
                                <option value="在职">在职</option>
                                <option value="退休">退休</option>
                                <option value="学生">学生</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row single">
                        <div class="form-group">
                            <label class="form-label">工作单位</label>
                            <input type="text" class="form-input" v-model="formData.company" placeholder="请输入工作单位">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">工作部门</label>
                            <input type="text" class="form-input" v-model="formData.department" placeholder="请输入部门">
                        </div>
                        <div class="form-group">
                            <label class="form-label">工作职务</label>
                            <input type="text" class="form-input" v-model="formData.position" placeholder="请输入职务">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">从事专业</label>
                            <input type="text" class="form-input" v-model="formData.profession" placeholder="请输入专业">
                        </div>
                        <div class="form-group">
                            <label class="form-label">工作单位电话</label>
                            <input type="text" class="form-input" v-model="formData.companyPhone" placeholder="请输入电话">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">学术/成果信息</div>
                    <div class="form-row single">
                        <div class="form-group">
                            <label class="form-label">研究方向</label>
                            <input type="text" class="form-input" v-model="formData.researchArea" placeholder="请输入研究方向">
                        </div>
                    </div>
                    <div class="form-row single">
                        <div class="form-group">
                            <label class="form-label">发表论著情况</label>
                            <textarea class="form-textarea" v-model="formData.publications" rows="3" placeholder="请输入发表的论文、著作等"></textarea>
                        </div>
                    </div>
                    <div class="form-row single">
                        <div class="form-group">
                            <label class="form-label">主要科技成果</label>
                            <textarea class="form-textarea" v-model="formData.achievements" rows="3" placeholder="请输入主要科技成果"></textarea>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">其他信息</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">何时加入本会</label>
                            <input type="text" class="form-input" v-model="formData.joinDate" placeholder="请输入时间">
                        </div>
                        <div class="form-group">
                            <label class="form-label">在本会担任的职务</label>
                            <input type="text" class="form-input" v-model="formData.societyPosition" placeholder="请输入职务">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">掌握外语</label>
                            <select class="form-select" v-model="formData.foreignLang">
                                <option value="英语">英语</option>
                                <option value="日语">日语</option>
                                <option value="法语">法语</option>
                                <option value="德语">德语</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">外语熟练程度</label>
                            <select class="form-select" v-model="formData.langLevel">
                                <option value="精通">精通</option>
                                <option value="熟练">熟练</option>
                                <option value="一般">一般</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row single">
                        <div class="form-group">
                            <label class="form-label">社会职务</label>
                            <input type="text" class="form-input" v-model="formData.socialPosition" placeholder="请输入社会职务">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">家庭电话号码</label>
                            <input type="text" class="form-input" v-model="formData.homePhone" placeholder="请输入电话">
                        </div>
                        <div class="form-group">
                            <label class="form-label">家庭通讯地址</label>
                            <input type="text" class="form-input" v-model="formData.homeAddress" placeholder="请输入地址">
                        </div>
                    </div>
                    <div class="form-row single">
                        <div class="form-group">
                            <label class="form-label">个人简介</label>
                            <textarea class="form-textarea" v-model="formData.bio" rows="4" placeholder="请输入个人简介（选填）"></textarea>
                        </div>
                    </div>
                </div>

                <div class="action-bar">
                    <button class="btn btn-default" @click="handleCancel">
                        <el-icon><Close /></el-icon>
                        取消
                    </button>
                    <button class="btn btn-primary" @click="handleSubmit">
                        <el-icon><Check /></el-icon>
                        提交变更
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive } = Vue;
        const { ElMessage } = ElementPlus;

        const app = createApp({
