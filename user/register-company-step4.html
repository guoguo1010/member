<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册单位会员 - 确认提交 - 中国农学会</title>
  <link rel="stylesheet" href="../css/web.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%); min-height: 100vh; }

    .navbar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 0 40px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .navbar-logo { display: flex; align-items: center; gap: 12px; color: white; font-size: 20px; font-weight: 600; }
    .navbar-logo-icon { font-size: 32px; }
    .navbar-menu { display: flex; gap: 4px; }
    .navbar-item { padding: 10px 20px; color: rgba(255, 255, 255, 0.9); text-decoration: none; border-radius: 8px; transition: all 0.3s; font-size: 15px; }
    .navbar-item:hover { background: rgba(255, 255, 255, 0.2); color: white; }
    .navbar-item.active { background: rgba(255, 255, 255, 0.3); color: white; }
    .navbar-user { display: flex; align-items: center; gap: 16px; color: white; }
    .navbar-avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: all 0.3s; }
    .navbar-avatar:hover { transform: scale(1.1); }

    .user-dropdown { position: relative; cursor: pointer; }
    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      min-width: 180px;
      padding: 8px 0;
      display: none;
      z-index: 1001;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #666;
      font-size: 14px;
      transition: all 0.3s;
      text-decoration: none;
    }
    .dropdown-item:hover { background: #f5f7fa; color: #667eea; }
    .dropdown-divider { height: 1px; background: #f0f0f0; margin: 8px 0; }

    .register-container { max-width: 1000px; margin: 0 auto; padding: 40px 24px; }

    .step-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
      padding: 0 20px;
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .step-item .step-num {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(102, 126, 234, 0.1);
      border: 2px solid rgba(102, 126, 234, 0.2);
      color: #999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s;
    }
    .step-item.active .step-num {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: #667eea;
      color: #fff;
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
    }
    .step-item.completed .step-num {
      background: linear-gradient(135deg, #52c41a, #73d13d);
      border-color: #52c41a;
      color: #fff;
      box-shadow: 0 4px 16px rgba(82, 196, 26, 0.4);
    }
    .step-item .step-label {
      margin-top: 10px;
      font-size: 13px;
      color: #999;
      font-weight: 500;
      white-space: nowrap;
    }
    .step-item.active .step-label { color: #667eea; font-weight: 600; }
    .step-item.completed .step-label { color: #52c41a; }
    .step-line {
      flex: 1;
      height: 3px;
      background: rgba(102, 126, 234, 0.1);
      margin: 0 -10px;
      margin-top: -20px;
      border-radius: 2px;
      max-width: 120px;
    }
    .step-line.filled { background: linear-gradient(90deg, #52c41a, #73d13d); }

    .form-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      padding: 32px;
      margin-bottom: 24px;
    }

    .form-section { margin-bottom: 28px; }
    .form-section:last-child { margin-bottom: 0; }

    .form-section-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(102, 126, 234, 0.1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-section-title::before {
      content: '';
      width: 4px;
      height: 18px;
      background: linear-gradient(180deg, #667eea, #764ba2);
      border-radius: 2px;
    }

    .upload-area {
      border: 2px dashed #e4e7ed;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #f8f9fc;
    }
    .upload-area:hover { border-color: #667eea; background: rgba(102, 126, 234, 0.04); }
    .upload-area .upload-icon { font-size: 36px; margin-bottom: 10px; color: #999; }
    .upload-area .upload-text { font-size: 14px; color: #666; }
    .upload-area .upload-hint { font-size: 12px; color: #999; margin-top: 6px; }
    .upload-area.has-file { border-color: #52c41a; background: rgba(82, 196, 26, 0.04); }
    .upload-area.has-file .upload-icon { color: #52c41a; }

    .info-summary {
      background: rgba(102, 126, 234, 0.04);
      border: 1px solid rgba(102, 126, 234, 0.1);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    .info-summary-item { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
    .info-summary-item .label { color: #999; }
    .info-summary-item .value { font-weight: 500; color: #333; }

    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
      border-top: 1px solid #f0f0f0;
      margin-top: 8px;
    }

    .btn {
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
    }
    .btn-default {
      background: #f5f7fa;
      color: #666;
      border: 1px solid #e4e7ed;
    }
    .btn-default:hover { background: #e4e7ed; }
    .btn-lg { padding: 14px 32px; font-size: 15px; }

    .template-download-box {
      background: rgba(102, 126, 234, 0.04);
      border: 1px solid rgba(102, 126, 234, 0.15);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .template-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .template-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .template-name {
      font-weight: 600;
      font-size: 15px;
      color: #333;
      margin-bottom: 4px;
    }
    .template-desc {
      font-size: 12px;
      color: #999;
    }
    .btn-download {
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s;
    }
    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .upload-area.has-stamp {
      border-color: #52c41a;
      background: rgba(82, 196, 26, 0.04);
    }
    .upload-area.has-stamp .upload-icon {
      color: #52c41a;
    }

    .fee-select-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .fee-select-item {
      background: #f8f9fc;
      border: 2px solid #e4e7ed;
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }
    .fee-select-item:hover { border-color: #764ba2; }
    .fee-select-item.active { border-color: #667eea; background: rgba(102, 126, 234, 0.08); }
    .fee-select-item .fee-period { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 4px; }
    .fee-select-item.active .fee-period { color: #667eea; }
    .fee-select-item .fee-amount { font-size: 22px; font-weight: 700; color: #667eea; }
  </style>
</head>
<body>
  <div id="app">
    <nav class="navbar">
      <div class="navbar-logo">
        <span class="navbar-logo-icon">🌾</span>
        <span>中国农学会</span>
      </div>
      <div class="navbar-menu">
        <a href="personal-center.html" class="navbar-item">首页</a>
        <a href="data-stats.html" class="navbar-item">数说学会</a>
        <a href="personal-info.html" class="navbar-item">会员信息</a>
        <a href="payment.html" class="navbar-item">缴费订单</a>
        <a href="messages.html" class="navbar-item">我的消息</a>
        <a href="growth-trajectory.html" class="navbar-item">成长轨迹</a>
      </div>
      <div class="navbar-user">
        <div class="navbar-avatar" style="cursor: pointer;" onclick="location.href='messages.html'">🔔</div>
        <div class="user-dropdown" onclick="this.querySelector('.dropdown-menu').classList.toggle('show')">
          <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <div class="navbar-avatar">张</div>
            <span>张三</span>
            <span style="font-size: 12px;">▼</span>
          </div>
          <div class="dropdown-menu">
            <a href="identity-switch.html" class="dropdown-item">
              <span>🔄</span>
              <span>切换身份</span>
            </a>
            <a href="account-settings.html" class="dropdown-item">
              <span>⚙️</span>
              <span>账号设置</span>
            </a>
            <div class="dropdown-divider"></div>
            <a href="login.html" class="dropdown-item">
              <span>🚪</span>
              <span>退出登录</span>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <div class="register-container">
      <div class="step-bar">
        <div class="step-item completed" id="step1">
          <div class="step-num">✓</div>
          <div class="step-label">选择类型</div>
        </div>
        <div class="step-line filled"></div>
        <div class="step-item completed" id="step2">
          <div class="step-num">✓</div>
          <div class="step-label">单位信息</div>
        </div>
        <div class="step-line filled"></div>
        <div class="step-item completed" id="step3">
          <div class="step-num">✓</div>
          <div class="step-label">联系人</div>
        </div>
        <div class="step-line filled"></div>
        <div class="step-item active" id="step4">
          <div class="step-num">4</div>
          <div class="step-label">确认提交</div>
        </div>
      </div>

      <div class="form-card">
        <div class="form-section">
          <div class="form-section-title">下载申请表模板</div>
          <div class="template-download-box">
            <div class="template-info">
              <div class="template-icon">📄</div>
              <div>
                <div class="template-name" id="templateName">单位会员入会申请表</div>
                <div class="template-desc">请下载模板，填写完成后盖章上传</div>
              </div>
            </div>
            <button class="btn-download" onclick="downloadTemplate()">
              <span>⬇️</span>
              下载模板
            </button>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">上传盖章文件</div>
          <div class="upload-area" id="stampUploadArea" onclick="document.getElementById('stampInput').click()">
            <input type="file" id="stampInput" style="display: none;" accept=".doc,.docx,.pdf" onchange="handleStampUpload(this)">
            <div class="upload-icon" id="stampUploadIcon">📄</div>
            <div class="upload-text" id="stampUploadText">点击上传盖章后的入会申请表</div>
            <div class="upload-hint">支持 doc、docx、pdf 格式</div>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">选择入会期限</div>
          <div class="fee-select-grid" id="feeGrid">
            <div class="fee-select-item active" data-period="1年" data-amount="2000" onclick="selectFee(this)">
              <div class="fee-period">1年</div>
              <div class="fee-amount">¥2000</div>
            </div>
            <div class="fee-select-item" data-period="2年" data-amount="3600" onclick="selectFee(this)">
              <div class="fee-period">2年</div>
              <div class="fee-amount">¥3600</div>
            </div>
            <div class="fee-select-item" data-period="终生" data-amount="20000" onclick="selectFee(this)">
              <div class="fee-period">终生</div>
              <div class="fee-amount">¥20000</div>
            </div>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">申请信息确认</div>
          <div class="info-summary">
            <div class="info-summary-item">
              <span class="label">会员类型</span>
              <span class="value" id="summaryType">-</span>
            </div>
            <div class="info-summary-item">
              <span class="label">缴费方式</span>
              <span class="value" id="summaryFee">-</span>
            </div>
            <div class="info-summary-item">
              <span class="label">发展机构</span>
              <span class="value" id="summaryOrg">-</span>
            </div>
            <div class="info-summary-item">
              <span class="label">单位名称</span>
              <span class="value" id="summaryName">-</span>
            </div>
          </div>

        </div>

        <div class="form-actions">
          <button class="btn btn-default btn-lg" onclick="goPrev()"><span style="margin-right: 4px;">←</span> 上一步</button>
          <div style="display: flex; gap: 12px;">
            <button class="btn btn-default btn-lg" onclick="saveOnly()">保存</button>
            <button class="btn btn-primary btn-lg" onclick="submitApplication()">提交申请</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    var typeNames = {
      normal: '普通单位会员',
      director: '理事单位会员'
    };

    var selectedFeePeriod = localStorage.getItem('reg_company_fee_period') || '1年';
    var selectedFeeAmount = localStorage.getItem('reg_company_fee_amount') || '2000';

    function init() {
      var type = localStorage.getItem('reg_company_type') || 'normal';
      selectedFeePeriod = localStorage.getItem('reg_company_fee_period') || selectedFeePeriod;
      selectedFeeAmount = localStorage.getItem('reg_company_fee_amount') || selectedFeeAmount;
      var orgName = localStorage.getItem('reg_company_org_name') || '北京市农学会';
      var step2 = JSON.parse(localStorage.getItem('reg_company_step2') || '{}');

      document.getElementById('summaryType').textContent = typeNames[type] || type;
      document.getElementById('summaryFee').textContent = selectedFeePeriod + ' - ¥' + selectedFeeAmount;
      document.getElementById('summaryOrg').textContent = orgName;
      document.getElementById('summaryName').textContent = step2.companyName || '-';

      // 高亮已选择的入会期限
      document.querySelectorAll('.fee-select-item').forEach(function(item) {
        if (item.dataset.period === selectedFeePeriod) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });

      var data = JSON.parse(localStorage.getItem('reg_company_step4') || '{}');
      if (data.stampFileName) {
        document.getElementById('stampUploadArea').classList.add('has-stamp');
        document.getElementById('stampUploadIcon').textContent = '✅';
        document.getElementById('stampUploadText').textContent = data.stampFileName;
      }
    }

    function handleStampUpload(input) {
      if (input.files && input.files[0]) {
        var file = input.files[0];
        document.getElementById('stampUploadArea').classList.add('has-stamp');
        document.getElementById('stampUploadIcon').textContent = '✅';
        document.getElementById('stampUploadText').textContent = file.name;
        saveData();
      }
    }

    function downloadTemplate() {
      var templateName = document.getElementById('templateName').textContent;
      showToast('正在下载：' + templateName + '.docx');
    }

    function saveData() {
      var stampFile = document.getElementById('stampInput').files[0];
      var data = {
        stampFileName: stampFile ? stampFile.name : (JSON.parse(localStorage.getItem('reg_company_step4') || '{}').stampFileName || '')
      };
      localStorage.setItem('reg_company_step4', JSON.stringify(data));
    }

    function selectFee(el) {
      document.querySelectorAll('.fee-select-item').forEach(function(item) { item.classList.remove('active'); });
      el.classList.add('active');
      selectedFeePeriod = el.dataset.period;
      selectedFeeAmount = el.dataset.amount;
      document.getElementById('summaryFee').textContent = selectedFeePeriod + ' - ¥' + selectedFeeAmount;
    }

    function saveOnly() {
      localStorage.setItem('reg_company_fee_period', selectedFeePeriod);
      localStorage.setItem('reg_company_fee_amount', selectedFeeAmount);
      saveData();
      showToast('保存成功');
    }

    function goPrev() {
      location.href = 'register-company-step3.html';
    }

    function submitApplication() {
      localStorage.setItem('reg_company_fee_period', selectedFeePeriod);
      localStorage.setItem('reg_company_fee_amount', selectedFeeAmount);
      localStorage.removeItem('reg_company_type');
      localStorage.removeItem('reg_company_fee_period');
      localStorage.removeItem('reg_company_fee_amount');
      localStorage.removeItem('reg_company_org_id');
      localStorage.removeItem('reg_company_org_name');
      localStorage.removeItem('reg_company_step2');
      localStorage.removeItem('reg_company_step3');
      localStorage.removeItem('reg_company_step4');
      location.href = 'register-company-pending.html';
    }

    init();
  </script>
</body>
</html>
