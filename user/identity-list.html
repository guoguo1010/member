<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任职身份 - 中国农学会</title>
  <link rel="stylesheet" href="../css/web.css">
  <script src="../js/vue.global.js"></script>
  <script src="../js/element-plus.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      min-height: 100vh;
    }

    .navbar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 0 40px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
      font-size: 20px;
      font-weight: 600;
    }

    .navbar-logo-icon { font-size: 32px; }

    .navbar-menu { display: flex; gap: 4px; }

    .navbar-item {
      padding: 10px 20px;
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.3s;
      font-size: 15px;
    }

    .navbar-item:hover { background: rgba(255, 255, 255, 0.2); color: white; }
    .navbar-item.active { background: rgba(255, 255, 255, 0.3); color: white; }

    .navbar-user { display: flex; align-items: center; gap: 16px; color: white; }

    .navbar-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .user-dropdown { position: relative; cursor: pointer; }
    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      min-width: 180px;
      padding: 8px 0;
      display: none;
      z-index: 1001;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #666;
      font-size: 14px;
      transition: all 0.3s;
      text-decoration: none;
    }
    .dropdown-item:hover { background: #f5f7fa; color: #667eea; }
    .dropdown-divider { height: 1px; background: #f0f0f0; margin: 8px 0; }

    .main-container { max-width: 1200px; margin: 0 auto; padding: 30px; }

    .page-header {
      background: white;
      border-radius: 16px;
      padding: 24px 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-title {
      font-size: 20px;
      font-weight: 600;
      color: #333;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .card-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid #f0f0f0; }

    .card-title { font-size: 18px; font-weight: 600; color: #333; display: flex; align-items: center; gap: 8px; }

    .identity-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .identity-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      background: #f8f9fc;
      border-radius: 12px;
      transition: all 0.3s;
    }

    .identity-item:hover { transform: translateX(4px); background: #f0f2f8; }

    .identity-info { display: flex; align-items: center; gap: 16px; }

    .identity-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .identity-name { font-size: 16px; color: #333; font-weight: 500; margin-bottom: 4px; }
    .identity-meta { font-size: 13px; color: #999; }

    .identity-status {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .identity-status.active {
      background: rgba(82, 196, 26, 0.1);
      color: #52c41a;
    }

    .identity-status.expired {
      background: rgba(245, 34, 45, 0.1);
      color: #f5222d;
    }

    .identity-status.pending {
      background: rgba(250, 173, 20, 0.1);
      color: #faad14;
    }

    @media (max-width: 768px) {
      .navbar { padding: 0 20px; }
      .navbar-menu { display: none; }
      .page-header { padding: 16px 20px; }
      .page-title { font-size: 18px; }
      .identity-item { flex-direction: column; align-items: flex-start; gap: 12px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <nav class="navbar">
      <div class="navbar-logo">
        <span class="navbar-logo-icon">🌾</span>
        <span>中国农学会</span>
      </div>
      <div class="navbar-menu">
        <a href="personal-center.html" class="navbar-item">首页</a>
        <a href="personal-info.html" class="navbar-item">会员信息</a>
        <a href="payment.html" class="navbar-item">缴费订单</a>
        <a href="messages.html" class="navbar-item">我的消息</a>
        <a href="growth-trajectory.html" class="navbar-item">成长轨迹</a>
      </div>
      <div class="navbar-user">
        <el-badge :value="3" class="item">
          <div class="navbar-avatar">🔔</div>
        </el-badge>
        <div class="user-dropdown" onclick="this.querySelector('.dropdown-menu').classList.toggle('show')">
          <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <div class="navbar-avatar">张</div>
            <span>张三</span>
            <span style="font-size: 12px;">▼</span>
          </div>
          <div class="dropdown-menu">
            <a href="identity-switch.html" class="dropdown-item">
              <span>🔄</span>
              <span>切换身份</span>
            </a>
            <a href="account-settings.html" class="dropdown-item">
              <span>⚙️</span>
              <span>账号设置</span>
            </a>
            <div class="dropdown-divider"></div>
            <a href="login.html" class="dropdown-item">
              <span>🚪</span>
              <span>退出登录</span>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <div class="main-container">
      <div class="page-header">
        <div class="page-title-group">
          <el-icon><User /></el-icon>
          <div>
            <div class="page-title">任职身份</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">💼 我的任职身份</div>
        </div>
        <div class="identity-list">
              <div class="identity-item">
                <div class="identity-info">
                  <div class="identity-icon">🏛️</div>
                  <div>
                    <div class="identity-name">中国农学会会员</div>
                    <div class="identity-meta">任职时间：2023-03-15 至 2026-03-14</div>
                  </div>
                </div>
                <span class="identity-status active">任期内</span>
              </div>
              <div class="identity-item">
                <div class="identity-info">
                  <div class="identity-icon">🎓</div>
                  <div>
                    <div class="identity-name">作物学专业委员会委员</div>
                    <div class="identity-meta">任职时间：2023-06-01 至 2026-05-31</div>
                  </div>
                </div>
                <span class="identity-status active">任期内</span>
              </div>
              <div class="identity-item">
                <div class="identity-info">
                  <div class="identity-icon">🌾</div>
                  <div>
                    <div class="identity-name">智慧农业分会会员</div>
                    <div class="identity-meta">任职时间：2022-09-01 至 2025-08-31</div>
                  </div>
                </div>
                <span class="identity-status expired">已到期</span>
              </div>
              <div class="identity-item">
                <div class="identity-info">
                  <div class="identity-icon">📚</div>
                  <div>
                    <div class="identity-name">学术期刊编委</div>
                    <div class="identity-meta">任职时间：2024-01-01 至 2027-12-31</div>
                  </div>
                </div>
                <span class="identity-status active">任期内</span>
              </div>
              <div class="identity-item">
                <div class="identity-info">
                  <div class="identity-icon">🏅</div>
                  <div>
                    <div class="identity-name">农业技术推广专家</div>
                    <div class="identity-meta">任职时间：2023-11-20 至 2025-11-19</div>
                  </div>
                </div>
                <span class="identity-status expired">已到期</span>
            </div>
          </div>
        </div>
    </div>

  <script>
    const { createApp } = Vue;
    const app = createApp({
      setup() {
        return {};
      }
    });
    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
