<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>站内通知 - 中国农学会</title>
  <link rel="stylesheet" href="../css/web.css">
  <script src="../js/vue.global.js"></script>
  <script src="../js/element-plus.js"></script>
  <script src="../js/icons-vue.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%); min-height: 100vh; }

    .navbar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 0 40px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .navbar-logo { display: flex; align-items: center; gap: 12px; color: white; font-size: 20px; font-weight: 600; }
    .navbar-logo-icon { font-size: 32px; }
    .navbar-menu { display: flex; gap: 4px; }
    .navbar-item { padding: 10px 20px; color: rgba(255, 255, 255, 0.9); text-decoration: none; border-radius: 8px; transition: all 0.3s; font-size: 15px; }
    .navbar-item:hover { background: rgba(255, 255, 255, 0.2); color: white; }
    .navbar-item.active { background: rgba(255, 255, 255, 0.3); color: white; }
    .navbar-user { display: flex; align-items: center; gap: 16px; color: white; }
    .navbar-avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: all 0.3s; }
    .navbar-avatar:hover { transform: scale(1.1); }

    .user-dropdown { position: relative; cursor: pointer; }
    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      min-width: 180px;
      padding: 8px 0;
      display: none;
      z-index: 1001;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #666;
      font-size: 14px;
      transition: all 0.3s;
      text-decoration: none;
    }
    .dropdown-item:hover { background: #f5f7fa; color: #667eea; }
    .dropdown-divider { height: 1px; background: #f0f0f0; margin: 8px 0; }

    .main-container { max-width: 1000px; margin: 0 auto; padding: 30px; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #667eea;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.3s;
    }
    .back-btn:hover { gap: 12px; }

    .page-header {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .page-title { font-size: 22px; font-weight: 600; color: #333; display: flex; align-items: center; gap: 12px; }
    .page-desc { color: #999; font-size: 14px; margin-top: 4px; }

    .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06); margin-bottom: 24px; }
    .card-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

    .notification-list { display: flex; flex-direction: column; gap: 12px; }

    .notification-item {
      padding: 20px;
      background: #f8f9fc;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      border-left: 4px solid transparent;
    }
    .notification-item:hover { background: #f0f2f8; transform: translateX(4px); }
    .notification-item.unread { border-left-color: #667eea; background: linear-gradient(90deg, rgba(102, 126, 234, 0.05) 0%, #f8f9fc 100%); }

    .notification-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .notification-title { font-weight: 600; font-size: 15px; color: #333; display: flex; align-items: center; gap: 8px; }
    .notification-title-link { font-weight: 600; font-size: 15px; color: #333; cursor: pointer; }
    .notification-title-link:hover { color: #667eea; }
    .notification-badge { width: 8px; height: 8px; background: #ff4d4f; border-radius: 50%; }
    .notification-time { font-size: 13px; color: #999; }
    .notification-content { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 10px; }
    .notification-footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #999; }
    .notification-footer-left { display: flex; align-items: center; gap: 8px; }
    .reply-btn { padding: 4px 12px; background: #f5f7fa; border: 1px solid #e4e7ed; border-radius: 4px; font-size: 12px; color: #666; cursor: pointer; transition: all 0.3s; }
    .reply-btn:hover { background: #667eea; color: white; border-color: #667eea; }

    .form-item { margin-bottom: 16px; }
    .form-label { font-size: 14px; color: #666; margin-bottom: 8px; display: block; }
    .form-input { width: 100%; padding: 10px 14px; border: 2px solid #e4e7ed; border-radius: 10px; font-size: 14px; transition: all 0.3s; }
    .form-input:focus { outline: none; border-color: #667eea; }
    .form-textarea { width: 100%; padding: 10px 14px; border: 2px solid #e4e7ed; border-radius: 10px; font-size: 14px; transition: all 0.3s; resize: vertical; min-height: 100px; }
    .form-textarea:focus { outline: none; border-color: #667eea; }
    .form-row { display: flex; gap: 16px; }
    .form-row .form-item { flex: 1; }
    .btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.3s; border: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-default { background: #f5f7fa; color: #666; border: 1px solid #e4e7ed; }
    .btn-default:hover { background: #e4e7ed; }

    .empty-state { text-align: center; padding: 60px 20px; color: #999; }
    .empty-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }

    .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 24px; }
    .page-btn { width: 36px; height: 36px; border-radius: 8px; background: white; border: 2px solid #e0e0e0; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; font-size: 14px; color: #666; }
    .page-btn:hover { border-color: #667eea; color: #667eea; }
    .page-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-color: transparent; }

    @media (max-width: 768px) {
      .navbar { padding: 0 20px; }
      .navbar-menu { display: none; }
      .main-container { padding: 20px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <nav class="navbar">
      <div class="navbar-logo">
        <span class="navbar-logo-icon">🌾</span>
        <span>中国农学会</span>
      </div>
      <div class="navbar-menu">
        <a href="company-home.html" class="navbar-item">单位主页</a>
        <a href="company-payment.html" class="navbar-item">缴费订单</a>
        <a href="company-notifications.html" class="navbar-item active">站内通知</a>
      </div>
      <div class="navbar-user">
        <div class="user-dropdown" onclick="this.querySelector('.dropdown-menu').classList.toggle('show')">
          <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <div class="navbar-avatar">北</div>
            <span>北京智慧农业科技有限公司</span>
            <span style="font-size: 12px;">▼</span>
          </div>
          <div class="dropdown-menu">
            <a href="identity-switch.html" class="dropdown-item"><span>🔄</span><span>切换身份</span></a>
            <a href="account-settings.html" class="dropdown-item"><span>⚙️</span><span>账号设置</span></a>
            <a href="javascript:void(0)" class="dropdown-item" onclick="openFeedbackModal()"><span>💬</span><span>意见反馈</span></a>
            <div class="dropdown-divider"></div>
            <a href="login.html" class="dropdown-item"><span>🚪</span><span>退出登录</span></a>
          </div>
        </div>
      </div>
    </nav>

    <div class="main-container">
      <div class="page-header">
        <div class="page-title">
          <el-icon><Bell /></el-icon>
          站内通知
        </div>
        <div class="page-desc">北京智慧农业科技有限公司 · 站内通知列表</div>
      </div>

      <div class="card">
        <div class="notification-list">
          <div class="notification-item" v-for="item in notifications" :key="item.id" :class="{ unread: !item.read }" @click="goDetail(item)" style="cursor: pointer;">
            <div class="notification-header">
              <a href="javascript:void(0)" @click.prevent="goDetail(item)" class="notification-title-link" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit;">
                {{ item.title }}
                <div class="notification-badge" v-if="!item.read"></div>
              </a>
              <div class="notification-time">{{ item.time }}</div>
            </div>
            <div class="notification-content">{{ item.content }}</div>
            <div class="notification-footer">
              <div class="notification-footer-left">发件人：{{ item.sender }}</div>
              <button class="reply-btn" @click.stop="showReplyDialog(item)">
                <el-icon><ChatLineSquare /></el-icon>
                回复
              </button>
            </div>
          </div>
        </div>

        <div class="empty-state" v-if="notifications.length === 0">
          <div class="empty-icon">🔔</div>
          <div>暂无站内通知</div>
        </div>

        <div class="pagination" v-if="notifications.length > 0">
          <div class="page-btn"><el-icon><ArrowLeft /></el-icon></div>
          <div class="page-btn active">1</div>
          <div class="page-btn">2</div>
          <div class="page-btn">3</div>
          <div class="page-btn"><el-icon><ArrowRight /></el-icon></div>
        </div>
      </div>

      <el-dialog v-model="replyDialogVisible" title="回复通知" width="500px" :close-on-click-modal="false">
        <div v-if="currentNotification" style="margin-bottom: 16px; padding: 12px; background: #f8f9fc; border-radius: 8px;">
          <div style="font-weight: 600; margin-bottom: 8px;">{{ currentNotification.title }}</div>
          <div style="font-size: 13px; color: #666;">{{ currentNotification.content }}</div>
        </div>
        <div class="form-item">
          <label class="form-label">回复内容</label>
          <textarea class="form-textarea" v-model="replyContent" placeholder="请输入回复内容..."></textarea>
        </div>
        <div class="form-item">
          <label class="form-label">上传附件</label>
          <input type="file" class="form-input" @change="handleReplyFileChange" accept=".jpg,.png,.pdf,.doc,.docx" style="padding: 8px;">
          <div style="font-size: 12px; color: #999; margin-top: 8px;">支持 jpg、png、pdf、doc、docx 格式</div>
        </div>
        <template #footer>
          <button class="btn btn-default" @click="replyDialogVisible = false">取消</button>
          <button class="btn btn-primary" @click="handleReply">提交回复</button>
        </template>
      </el-dialog>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;
    const { ElMessage } = ElementPlus;

    const app = createApp({
      setup() {
        const notifications = ref([
          {
            id: 1,
            title: '关于2024年度会费缴纳的通知',
            content: '尊敬的单位会员：北京智慧农业科技有限公司，您好！2024年度会费开始缴纳，请于2024年3月31日前完成缴费，缴费标准为50,000元/年。',
            sender: '学会秘书处',
            time: '2024-01-15 10:00',
            read: false,
            attachments: ['2024年度会费缴纳通知.pdf']
          },
          {
            id: 2,
            title: '2024年度学术年会参会邀请',
            content: '中国农学会2024年度学术年会将于2024年12月15-17日在北京国际会议中心召开，诚邀贵单位作为理事单位参与主办。',
            sender: '学术部',
            time: '2024-01-10 09:30',
            read: false
          },
          {
            id: 3,
            title: '会员等级调整通知',
            content: '经学会理事会审议通过，贵单位会员等级由普通单位会员调整为理事单位会员，生效日期为2024年1月1日。',
            sender: '会员服务部',
            time: '2023-12-20 14:00',
            read: true
          },
          {
            id: 4,
            title: '关于举办智慧农业论坛的通知',
            content: '第五届全国智慧农业创新大赛将于2024年5月在杭州举办，诚邀贵单位参会并展示最新技术成果。',
            sender: '学术部',
            time: '2023-12-15 11:00',
            read: true
          },
          {
            id: 5,
            title: '2023年度会费缴纳完成确认',
            content: '贵单位2023年度会费50,000元已缴纳成功，缴费收据将于5个工作日内寄出，请注意查收。',
            sender: '财务部',
            time: '2023-01-20 16:30',
            read: true
          },
          {
            id: 6,
            title: '新入会单位会员公示',
            content: '经学会审核，现对2023年第一批新入会单位会员进行公示，公示期为7天，如有异议请及时反馈。',
            sender: '会员服务部',
            time: '2023-01-10 09:00',
            read: true
          }
        ]);

        const goDetail = (item) => {
          location.href = 'notification-detail.html?id=' + item.id;
        };

        const replyDialogVisible = ref(false);
        const currentNotification = ref(null);
        const replyContent = ref('');
        const replyFile = ref(null);

        const showReplyDialog = (item) => {
          currentNotification.value = item;
          replyContent.value = '';
          replyFile.value = null;
          replyDialogVisible.value = true;
        };

        const handleReplyFileChange = (e) => {
          replyFile.value = e.target.files[0];
        };

        const handleReply = () => {
          if (!replyContent.value) {
            ElMessage.warning('请输入回复内容');
            return;
          }
          ElMessage.success('回复已提交');
          replyDialogVisible.value = false;
        };

        return {
          notifications,
          goDetail,
          replyDialogVisible,
          currentNotification,
          replyContent,
          replyFile,
          showReplyDialog,
          handleReplyFileChange,
          handleReply
        };
      }
    });

    app.use(ElementPlus);
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
      app.component(key, component);
    }
    app.mount('#app');
  </script>
</body>
</html>
