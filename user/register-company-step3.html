<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册单位会员 - 联系人 - 中国农学会</title>
  <link rel="stylesheet" href="../css/web.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%); min-height: 100vh; }

    .navbar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 0 40px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .navbar-logo { display: flex; align-items: center; gap: 12px; color: white; font-size: 20px; font-weight: 600; }
    .navbar-logo-icon { font-size: 32px; }
    .navbar-menu { display: flex; gap: 4px; }
    .navbar-item { padding: 10px 20px; color: rgba(255, 255, 255, 0.9); text-decoration: none; border-radius: 8px; transition: all 0.3s; font-size: 15px; }
    .navbar-item:hover { background: rgba(255, 255, 255, 0.2); color: white; }
    .navbar-item.active { background: rgba(255, 255, 255, 0.3); color: white; }
    .navbar-user { display: flex; align-items: center; gap: 16px; color: white; }
    .navbar-avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: all 0.3s; }
    .navbar-avatar:hover { transform: scale(1.1); }

    .user-dropdown { position: relative; cursor: pointer; }
    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      min-width: 180px;
      padding: 8px 0;
      display: none;
      z-index: 1001;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #666;
      font-size: 14px;
      transition: all 0.3s;
      text-decoration: none;
    }
    .dropdown-item:hover { background: #f5f7fa; color: #667eea; }
    .dropdown-divider { height: 1px; background: #f0f0f0; margin: 8px 0; }

    .register-container { max-width: 1000px; margin: 0 auto; padding: 40px 24px; }

    .step-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
      padding: 0 20px;
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .step-item .step-num {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(102, 126, 234, 0.1);
      border: 2px solid rgba(102, 126, 234, 0.2);
      color: #999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s;
    }
    .step-item.active .step-num {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: #667eea;
      color: #fff;
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
    }
    .step-item.completed .step-num {
      background: linear-gradient(135deg, #52c41a, #73d13d);
      border-color: #52c41a;
      color: #fff;
      box-shadow: 0 4px 16px rgba(82, 196, 26, 0.4);
    }
    .step-item .step-label {
      margin-top: 10px;
      font-size: 13px;
      color: #999;
      font-weight: 500;
      white-space: nowrap;
    }
    .step-item.active .step-label { color: #667eea; font-weight: 600; }
    .step-item.completed .step-label { color: #52c41a; }
    .step-line {
      flex: 1;
      height: 3px;
      background: rgba(102, 126, 234, 0.1);
      margin: 0 -10px;
      margin-top: -20px;
      border-radius: 2px;
      max-width: 120px;
    }
    .step-line.filled { background: linear-gradient(90deg, #52c41a, #73d13d); }

    .form-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      padding: 32px;
      margin-bottom: 24px;
    }

    .form-section { margin-bottom: 28px; }
    .form-section:last-child { margin-bottom: 0; }

    .form-section-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(102, 126, 234, 0.1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-section-title::before {
      content: '';
      width: 4px;
      height: 18px;
      background: linear-gradient(180deg, #667eea, #764ba2);
      border-radius: 2px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }
    .form-row.single { grid-template-columns: 1fr; }
    .form-row:last-child { margin-bottom: 0; }

    .form-group { margin-bottom: 0; }
    .form-group:last-child { margin-bottom: 0; }

    .form-label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-label .required { color: #ff4d4f; margin-left: 2px; }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e4e7ed;
      border-radius: 8px;
      font-size: 14px;
      color: #333;
      background: #fff;
      transition: all 0.3s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      outline: none;
    }
    .form-input::placeholder { color: #c0c4cc; }

    .hint-box {
      background: rgba(102, 126, 234, 0.04);
      border: 1px solid rgba(102, 126, 234, 0.1);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: #666;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 16px;
    }
    .hint-box::before { content: '💡'; font-size: 16px; }

    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
      border-top: 1px solid #f0f0f0;
      margin-top: 8px;
    }

    .btn {
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
    }
    .btn-default {
      background: #f5f7fa;
      color: #666;
      border: 1px solid #e4e7ed;
    }
    .btn-default:hover { background: #e4e7ed; }
    .btn-lg { padding: 14px 32px; font-size: 15px; }
  </style>
</head>
<body>
  <div id="app">
    <nav class="navbar">
      <div class="navbar-logo">
        <span class="navbar-logo-icon">🌾</span>
        <span>中国农学会</span>
      </div>
      <div class="navbar-menu">
        <a href="personal-center.html" class="navbar-item">首页</a>
        <a href="data-stats.html" class="navbar-item">数说学会</a>
        <a href="personal-info.html" class="navbar-item">会员信息</a>
        <a href="payment.html" class="navbar-item">缴费订单</a>
        <a href="messages.html" class="navbar-item">我的消息</a>
        <a href="growth-trajectory.html" class="navbar-item">成长轨迹</a>
      </div>
      <div class="navbar-user">
        <div class="navbar-avatar" style="cursor: pointer;" onclick="location.href='messages.html'">🔔</div>
        <div class="user-dropdown" onclick="this.querySelector('.dropdown-menu').classList.toggle('show')">
          <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <div class="navbar-avatar">张</div>
            <span>张三</span>
            <span style="font-size: 12px;">▼</span>
          </div>
          <div class="dropdown-menu">
            <a href="identity-switch.html" class="dropdown-item">
              <span>🔄</span>
              <span>切换身份</span>
            </a>
            <a href="account-settings.html" class="dropdown-item">
              <span>⚙️</span>
              <span>账号设置</span>
            </a>
            <div class="dropdown-divider"></div>
            <a href="login.html" class="dropdown-item">
              <span>🚪</span>
              <span>退出登录</span>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <div class="register-container">
      <div class="step-bar">
        <div class="step-item completed" id="step1">
          <div class="step-num">✓</div>
          <div class="step-label">选择类型</div>
        </div>
        <div class="step-line filled"></div>
        <div class="step-item completed" id="step2">
          <div class="step-num">✓</div>
          <div class="step-label">单位信息</div>
        </div>
        <div class="step-line filled"></div>
        <div class="step-item active" id="step3">
          <div class="step-num">3</div>
          <div class="step-label">联系人</div>
        </div>
        <div class="step-line"></div>
        <div class="step-item" id="step4">
          <div class="step-num">4</div>
          <div class="step-label">确认提交</div>
        </div>
      </div>

      <div class="form-card">
        <div class="form-section">
          <div class="form-section-title">单位负责人信息（如为高校二级学院，请填写学院负责人信息）</div>
          <div class="hint-box">单位主要负责人信息</div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">姓名 <span class="required">*</span></label>
              <input type="text" class="form-input" id="leaderName" placeholder="请输入负责人姓名">
            </div>
            <div class="form-group">
              <label class="form-label">性别</label>
              <select class="form-select" id="leaderGender">
                <option value="男">男</option>
                <option value="女">女</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">职务/职称</label>
              <input type="text" class="form-input" id="leaderTitle" placeholder="请输入职务/职称">
            </div>
            <div class="form-group">
              <label class="form-label">所在部门</label>
              <input type="text" class="form-input" id="leaderDept" placeholder="请输入部门">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">办公电话</label>
              <input type="text" class="form-input" id="leaderOfficePhone" placeholder="请输入办公电话">
            </div>
            <div class="form-group">
              <label class="form-label">手机号码 <span class="required">*</span></label>
              <input type="text" class="form-input" id="leaderPhone" placeholder="请输入手机号">
            </div>
          </div>
          <div class="form-row single">
            <div class="form-group">
              <label class="form-label">电子邮箱 <span class="required">*</span></label>
              <input type="email" class="form-input" id="leaderEmail" placeholder="请输入邮箱">
            </div>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">联系人信息</div>
          <div class="hint-box">日常事务联系人信息</div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">姓名 <span class="required">*</span></label>
              <input type="text" class="form-input" id="contactName" placeholder="请输入联系人姓名">
            </div>
            <div class="form-group">
              <label class="form-label">性别</label>
              <select class="form-select" id="contactGender">
                <option value="男">男</option>
                <option value="女">女</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">年龄</label>
              <input type="text" class="form-input" id="contactAge" placeholder="请输入年龄">
            </div>
            <div class="form-group">
              <label class="form-label">职务/职称</label>
              <input type="text" class="form-input" id="contactPosition" placeholder="请输入职务/职称">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">所在部门</label>
              <input type="text" class="form-input" id="contactDept" placeholder="请输入部门">
            </div>
            <div class="form-group">
              <label class="form-label">办公电话</label>
              <input type="text" class="form-input" id="contactOfficePhone" placeholder="请输入办公电话">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">手机号码 <span class="required">*</span></label>
              <input type="text" class="form-input" id="contactPhone" value="138****8001" disabled>
              <div style="margin-top: 6px; font-size: 12px; color: #999;">联系人手机号为登录账号，脱敏只读展示</div>
            </div>
            <div class="form-group">
              <label class="form-label">电子邮箱 <span class="required">*</span></label>
              <input type="email" class="form-input" id="contactEmail" placeholder="请输入邮箱">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">传真</label>
              <input type="text" class="form-input" id="contactFax" placeholder="请输入传真">
            </div>
            <div class="form-group">
              <label class="form-label">通讯地址</label>
              <input type="text" class="form-input" id="contactAddress" placeholder="请输入通讯地址">
            </div>
          </div>
          <div class="form-row single">
            <div class="form-group">
              <label class="form-label">邮编</label>
              <input type="text" class="form-input" id="contactZip" placeholder="请输入邮编">
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-default btn-lg" onclick="goPrev()"><span style="margin-right: 4px;">←</span> 上一步</button>
          <div style="display: flex; gap: 12px;">
            <button class="btn btn-default btn-lg" onclick="saveOnly()">保存</button>
            <button class="btn btn-primary btn-lg" onclick="goNext()">下一步 <span style="margin-left: 4px;">→</span></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    function init() {
      var data = JSON.parse(localStorage.getItem('reg_company_step3') || '{}');
      if (data.leaderName) document.getElementById('leaderName').value = data.leaderName;
      if (data.leaderTitle) document.getElementById('leaderTitle').value = data.leaderTitle;
      if (data.leaderGender) document.getElementById('leaderGender').value = data.leaderGender;
      if (data.leaderDept) document.getElementById('leaderDept').value = data.leaderDept;
      if (data.leaderPhone) document.getElementById('leaderPhone').value = data.leaderPhone;
      if (data.leaderEmail) document.getElementById('leaderEmail').value = data.leaderEmail;
      if (data.leaderOfficePhone) document.getElementById('leaderOfficePhone').value = data.leaderOfficePhone;
      if (data.contactName) document.getElementById('contactName').value = data.contactName;
      if (data.contactGender) document.getElementById('contactGender').value = data.contactGender;
      if (data.contactAge) document.getElementById('contactAge').value = data.contactAge;
      if (data.contactPosition) document.getElementById('contactPosition').value = data.contactPosition;
      if (data.contactDept) document.getElementById('contactDept').value = data.contactDept;
      if (data.contactPhone) document.getElementById('contactPhone').value = data.contactPhone;
      if (data.contactEmail) document.getElementById('contactEmail').value = data.contactEmail;
      if (data.contactOfficePhone) document.getElementById('contactOfficePhone').value = data.contactOfficePhone;
      if (data.contactFax) document.getElementById('contactFax').value = data.contactFax;
      if (data.contactAddress) document.getElementById('contactAddress').value = data.contactAddress;
      if (data.contactZip) document.getElementById('contactZip').value = data.contactZip;
    }

    function saveData() {
      var data = {
        leaderName: document.getElementById('leaderName').value,
        leaderTitle: document.getElementById('leaderTitle').value,
        leaderGender: document.getElementById('leaderGender').value,
        leaderDept: document.getElementById('leaderDept').value,
        leaderPhone: document.getElementById('leaderPhone').value,
        leaderEmail: document.getElementById('leaderEmail').value,
        leaderOfficePhone: document.getElementById('leaderOfficePhone').value,
        contactName: document.getElementById('contactName').value,
        contactGender: document.getElementById('contactGender').value,
        contactAge: document.getElementById('contactAge').value,
        contactPosition: document.getElementById('contactPosition').value,
        contactDept: document.getElementById('contactDept').value,
        contactPhone: document.getElementById('contactPhone').value,
        contactEmail: document.getElementById('contactEmail').value,
        contactOfficePhone: document.getElementById('contactOfficePhone').value,
        contactFax: document.getElementById('contactFax').value,
        contactAddress: document.getElementById('contactAddress').value,
        contactZip: document.getElementById('contactZip').value
      };
      localStorage.setItem('reg_company_step3', JSON.stringify(data));
    }

    function saveOnly() {
      saveData();
      showToast('保存成功');
    }

    function goPrev() {
      saveData();
      location.href = 'register-company-step2.html';
    }

    function goNext() {
      saveData();
      location.href = 'register-company-step4.html';
    }

    init();
  </script>
</body>
</html>
