<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册个人会员 - 基本信息 - 中国农学会</title>
  <link rel="stylesheet" href="../css/web.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%); min-height: 100vh; }

    .navbar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 0 40px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .navbar-logo { display: flex; align-items: center; gap: 12px; color: white; font-size: 20px; font-weight: 600; }
    .navbar-logo-icon { font-size: 32px; }
    .navbar-menu { display: flex; gap: 4px; }
    .navbar-item { padding: 10px 20px; color: rgba(255, 255, 255, 0.9); text-decoration: none; border-radius: 8px; transition: all 0.3s; font-size: 15px; }
    .navbar-item:hover { background: rgba(255, 255, 255, 0.2); color: white; }
    .navbar-item.active { background: rgba(255, 255, 255, 0.3); color: white; }
    .navbar-user { display: flex; align-items: center; gap: 16px; color: white; }
    .navbar-avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: all 0.3s; }
    .navbar-avatar:hover { transform: scale(1.1); }

    .user-dropdown { position: relative; cursor: pointer; }
    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      min-width: 180px;
      padding: 8px 0;
      display: none;
      z-index: 1001;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #666;
      font-size: 14px;
      transition: all 0.3s;
      text-decoration: none;
    }
    .dropdown-item:hover { background: #f5f7fa; color: #667eea; }
    .dropdown-divider { height: 1px; background: #f0f0f0; margin: 8px 0; }

    .register-container { max-width: 1000px; margin: 0 auto; padding: 40px 24px; }

    .step-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
      padding: 0 20px;
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .step-item .step-num {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(102, 126, 234, 0.1);
      border: 2px solid rgba(102, 126, 234, 0.2);
      color: #999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s;
    }
    .step-item.active .step-num {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: #667eea;
      color: #fff;
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
    }
    .step-item.completed .step-num {
      background: linear-gradient(135deg, #52c41a, #73d13d);
      border-color: #52c41a;
      color: #fff;
      box-shadow: 0 4px 16px rgba(82, 196, 26, 0.4);
    }
    .step-item .step-label {
      margin-top: 10px;
      font-size: 13px;
      color: #999;
      font-weight: 500;
      white-space: nowrap;
    }
    .step-item.active .step-label { color: #667eea; font-weight: 600; }
    .step-item.completed .step-label { color: #52c41a; }
    .step-line {
      flex: 1;
      height: 3px;
      background: rgba(102, 126, 234, 0.1);
      margin: 0 -10px;
      margin-top: -20px;
      border-radius: 2px;
      max-width: 120px;
    }
    .step-line.filled { background: linear-gradient(90deg, #52c41a, #73d13d); }

    .form-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      padding: 32px;
      margin-bottom: 24px;
    }

    .form-section {
      margin-bottom: 28px;
    }
    .form-section:last-child { margin-bottom: 0; }

    .form-section-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(102, 126, 234, 0.1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-section-title::before {
      content: '';
      width: 4px;
      height: 18px;
      background: linear-gradient(180deg, #667eea, #764ba2);
      border-radius: 2px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }
    .form-row.single { grid-template-columns: 1fr; }
    .form-row:last-child { margin-bottom: 0; }

    .form-group { margin-bottom: 0; }
    .form-group:last-child { margin-bottom: 0; }

    .form-label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-label .required { color: #ff4d4f; margin-left: 2px; }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e4e7ed;
      border-radius: 8px;
      font-size: 14px;
      color: #333;
      background: #fff;
      transition: all 0.3s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      outline: none;
    }
    .form-input:disabled {
      background: #f5f7fa;
      color: #999;
      cursor: not-allowed;
    }
    .form-input::placeholder { color: #c0c4cc; }

    .form-select-search {
      position: relative;
    }
    .form-select-search .select-trigger {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e4e7ed;
      border-radius: 8px;
      font-size: 14px;
      color: #333;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s;
    }
    .form-select-search .select-trigger:hover { border-color: #667eea; }
    .form-select-search.open .select-trigger {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      border-radius: 8px 8px 0 0;
    }
    .form-select-search .select-trigger .placeholder { color: #c0c4cc; }
    .form-select-search .select-trigger .arrow { font-size: 10px; color: #999; transition: transform 0.3s; }
    .form-select-search.open .select-trigger .arrow { transform: rotate(180deg); }
    .form-select-search .select-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #667eea;
      border-top: none;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.15);
      z-index: 100;
      display: none;
      max-height: 280px;
      overflow: hidden;
    }
    .form-select-search.open .select-dropdown { display: block; }
    .form-select-search .select-search {
      padding: 10px;
      border-bottom: 1px solid #f0f0f0;
    }
    .form-select-search .select-search input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e4e7ed;
      border-radius: 6px;
      font-size: 13px;
    }
    .form-select-search .select-search input:focus {
      border-color: #667eea;
      outline: none;
    }
    .form-select-search .select-options {
      max-height: 220px;
      overflow-y: auto;
    }
    .form-select-search .select-option {
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .form-select-search .select-option:hover { background: rgba(102, 126, 234, 0.06); }
    .form-select-search .select-option.selected { background: rgba(102, 126, 234, 0.1); color: #667eea; }
    .form-select-search .select-option .option-name { font-weight: 500; }
    .form-select-search .select-option .option-type { font-size: 12px; color: #999; margin-left: 8px; }
    .form-select-search .select-empty {
      padding: 20px;
      text-align: center;
      color: #999;
      font-size: 13px;
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
      border-top: 1px solid #f0f0f0;
      margin-top: 8px;
    }

    .btn {
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
    }
    .btn-default {
      background: #f5f7fa;
      color: #666;
      border: 1px solid #e4e7ed;
    }
    .btn-default:hover { background: #e4e7ed; }
    .btn-lg { padding: 14px 32px; font-size: 15px; }
  </style>
</head>
<body>
  <div id="app">
    <nav class="navbar">
      <div class="navbar-logo">
        <span class="navbar-logo-icon">🌾</span>
        <span>中国农学会</span>
      </div>
      <div class="navbar-menu">
        <a href="personal-center.html" class="navbar-item">首页</a>
        <a href="data-stats.html" class="navbar-item">数说学会</a>
        <a href="personal-info.html" class="navbar-item">会员信息</a>
        <a href="payment.html" class="navbar-item">缴费订单</a>
        <a href="messages.html" class="navbar-item">我的消息</a>
        <a href="growth-trajectory.html" class="navbar-item">成长轨迹</a>
      </div>
      <div class="navbar-user">
        <div class="navbar-avatar" style="cursor: pointer;" onclick="location.href='messages.html'">🔔</div>
        <div class="user-dropdown" onclick="this.querySelector('.dropdown-menu').classList.toggle('show')">
          <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <div class="navbar-avatar">张</div>
            <span>张三</span>
            <span style="font-size: 12px;">▼</span>
          </div>
          <div class="dropdown-menu">
            <a href="identity-switch.html" class="dropdown-item">
              <span>🔄</span>
              <span>切换身份</span>
            </a>
            <a href="account-settings.html" class="dropdown-item">
              <span>⚙️</span>
              <span>账号设置</span>
            </a>
            <div class="dropdown-divider"></div>
            <a href="login.html" class="dropdown-item">
              <span>🚪</span>
              <span>退出登录</span>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <div class="register-container">
      <div class="step-bar">
        <div class="step-item completed" id="step1">
          <div class="step-num">✓</div>
          <div class="step-label">选择类型</div>
        </div>
        <div class="step-line filled"></div>
        <div class="step-item active" id="step2">
          <div class="step-num">2</div>
          <div class="step-label">基本信息</div>
        </div>
        <div class="step-line"></div>
        <div class="step-item" id="step3">
          <div class="step-num">3</div>
          <div class="step-label">其他信息</div>
        </div>
        <div class="step-line"></div>
        <div class="step-item" id="step4">
          <div class="step-num">4</div>
          <div class="step-label">确认提交</div>
        </div>
      </div>

      <div class="form-card">
        <div class="form-section">
          <div class="form-section-title">基本信息</div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">发展来源 <span class="required">*</span></label>
              <div class="form-select-search" id="orgSelect">
                <div class="select-trigger" onclick="toggleOrgSelect()">
                  <span class="placeholder">请选择发展来源机构</span>
                  <span class="arrow">▼</span>
                </div>
                <div class="select-dropdown">
                  <div class="select-search">
                    <input type="text" placeholder="搜索机构名称..." oninput="filterOrgOptions(this.value)">
                  </div>
                  <div class="select-options"></div>
                </div>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">真实姓名 <span class="required">*</span></label>
              <input type="text" class="form-input" id="realName" placeholder="请输入真实姓名">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">性别 <span class="required">*</span></label>
            <select class="form-select" id="gender">
              <option value="男">男</option>
              <option value="女">女</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">出生日期</label>
              <input type="date" class="form-input" id="birthDate">
            </div>
            <div class="form-group">
              <label class="form-label">国籍</label>
              <select class="form-select" id="nationality">
                <option value="中国">中国</option>
                <option value="美国">美国</option>
                <option value="英国">英国</option>
                <option value="日本">日本</option>
                <option value="其他">其他</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">护照</label>
              <input type="text" class="form-input" id="passport" placeholder="请输入护照号">
            </div>
            <div class="form-group">
              <label class="form-label">籍贯</label>
              <input type="text" class="form-input" id="birthplace" placeholder="请输入籍贯">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">民族</label>
              <select class="form-select" id="ethnicity">
                <option value="汉族">汉族</option>
                <option value="蒙古族">蒙古族</option>
                <option value="回族">回族</option>
                <option value="藏族">藏族</option>
                <option value="维吾尔族">维吾尔族</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">政治面貌</label>
              <select class="form-select" id="politicalStatus">
                <option value="群众">群众</option>
                <option value="中共党员">中共党员</option>
                <option value="共青团员">共青团员</option>
                <option value="民主党派">民主党派</option>
                <option value="无党派人士">无党派人士</option>
              </select>
            </div>
          </div>
          <div class="form-row single">
            <div class="form-group">
              <label class="form-label">身份证号 <span class="required">*</span></label>
              <input type="text" class="form-input" id="idCard" placeholder="请输入身份证号">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">最高学历</label>
              <select class="form-select" id="education">
                <option value="博士研究生">博士研究生</option>
                <option value="硕士研究生">硕士研究生</option>
                <option value="大学本科">大学本科</option>
                <option value="大学专科">大学专科</option>
                <option value="中等学校">中等学校</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">毕业院校</label>
              <input type="text" class="form-input" id="gradSchool" placeholder="请输入毕业院校">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">专业</label>
              <input type="text" class="form-input" id="major" placeholder="请输入专业">
            </div>
            <div class="form-group">
              <label class="form-label">所在单位</label>
              <input type="text" class="form-input" id="company" placeholder="请输入所在单位">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">职称/身份</label>
              <input type="text" class="form-input" id="titleIdentity" placeholder="请输入职称/身份">
            </div>
            <div class="form-group">
              <label class="form-label">联系电话</label>
              <input type="text" class="form-input" id="contactPhone" value="138****8001" disabled>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">电子邮箱</label>
              <input type="email" class="form-input" id="email" placeholder="请输入电子邮箱">
            </div>
            <div class="form-group">
              <label class="form-label">所在地区</label>
              <input type="text" class="form-input" id="region" placeholder="请输入所在地区">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">详细地址</label>
              <input type="text" class="form-input" id="detailAddress" placeholder="请输入详细地址">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">照片</label>
              <input type="file" class="form-input" id="photo">
            </div>
            <div class="form-group">
              <label class="form-label">感兴趣的分支机构</label>
              <select class="form-select" id="interestBranches" multiple>
                <option value="作物学专业委员会">作物学专业委员会</option>
                <option value="园艺学专业委员会">园艺学专业委员会</option>
                <option value="植物保护专业委员会">植物保护专业委员会</option>
                <option value="土壤学专业委员会">土壤学专业委员会</option>
                <option value="秘书处">秘书处</option>
                <option value="学术交流部">学术交流部</option>
                <option value="会员服务部">会员服务部</option>
              </select>
              <div style="font-size: 12px; color: #999; margin-top: 6px;">最多选择 5 个</div>
            </div>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">学生信息</div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">在读学校</label>
              <input type="text" class="form-input" id="schoolName" placeholder="请输入在读学校">
            </div>
            <div class="form-group">
              <label class="form-label">在读专业</label>
              <input type="text" class="form-input" id="schoolMajor" placeholder="请输入在读专业">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">入学时间</label>
              <input type="date" class="form-input" id="admissionDate">
            </div>
            <div class="form-group">
              <label class="form-label">毕业时间</label>
              <input type="date" class="form-input" id="graduationDate">
            </div>
          </div>
          <div class="form-row single">
            <div class="form-group">
              <label class="form-label">学生证号</label>
              <input type="text" class="form-input" id="studentId" placeholder="请输入学生证号">
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-default btn-lg" onclick="goPrev()"><span style="margin-right: 4px;">←</span> 上一步</button>
          <div style="display: flex; gap: 12px;">
            <button class="btn btn-default btn-lg" onclick="saveOnly()">保存</button>
            <button class="btn btn-primary btn-lg" onclick="goNext()">下一步 <span style="margin-left: 4px;">→</span></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    var isInternational = localStorage.getItem('reg_type') === 'foreign';
    var selectedOrgId = localStorage.getItem('reg_org_id') || '';
    var selectedOrgName = localStorage.getItem('reg_org_name') || '';

    var orgData = [
      { id: 1, name: '北京市农学会', type: '省级学会' },
      { id: 2, name: '山东省农学会', type: '省级学会' },
      { id: 3, name: '江苏省农学会', type: '省级学会' },
      { id: 4, name: '浙江省农学会', type: '省级学会' },
      { id: 5, name: '广东省农学会', type: '省级学会' },
      { id: 6, name: '杭州市农学会', type: '市级学会' },
      { id: 7, name: '南京市农学会', type: '市级学会' },
      { id: 8, name: '广州市农学会', type: '市级学会' },
      { id: 9, name: '作物学专业委员会', type: '专业委员会' },
      { id: 10, name: '园艺学专业委员会', type: '专业委员会' },
      { id: 11, name: '植物保护专业委员会', type: '专业委员会' },
      { id: 12, name: '土壤学专业委员会', type: '专业委员会' },
      { id: 13, name: '秘书处', type: '分支机构' },
      { id: 14, name: '学术交流部', type: '分支机构' },
      { id: 15, name: '会员服务部', type: '分支机构' }
    ];

    var i18n = {
      '基本信息': 'Basic Information',
      '学生信息': 'Student Information',
      '发展来源': 'Development Source',
      '真实姓名': 'Full Name',
      '性别': 'Gender',
      '出生日期': 'Date of Birth',
      '护照': 'Passport Number',
      '民族': 'Ethnicity',
      '身份证号': 'ID Number',
      '政治面貌': 'Political Status',
      '所在单位': 'Organization',
      '职称/身份': 'Title / Identity',
      '联系电话': 'Contact Phone',
      '电子邮箱': 'Email',
      '所在地区': 'Region',
      '详细地址': 'Detailed Address',
      '国籍': 'Nationality',
      '籍贯': 'Place of Birth',
      '最高学历': 'Highest Education',
      '毕业院校': 'University',
      '专业': 'Major',
      '照片': 'Photo',
      '感兴趣的分支机构': 'Interested Branches',
      '在读学校': 'Current School',
      '在读专业': 'Current Major',
      '入学时间': 'Admission Date',
      '毕业时间': 'Graduation Date',
      '学生证号': 'Student ID'
    };

    var genderOptions = {
      '男': 'Male',
      '女': 'Female',
      '其他': 'Other'
    };

    function switchToInternational() {
      if (!isInternational) return;
      document.querySelectorAll('.form-section-title').forEach(function(el) {
        var text = el.childNodes[el.childNodes.length - 1].textContent.trim();
        if (i18n[text]) el.childNodes[el.childNodes.length - 1].textContent = i18n[text];
      });
      document.querySelectorAll('.form-label').forEach(function(el) {
        var text = el.childNodes[el.childNodes.length - 1].textContent;
        var required = el.querySelector('.required');
        var reqMark = required ? ' *' : '';
        if (i18n[text]) el.innerHTML = i18n[text] + (required ? '<span class="required">*</span>' : '');
      });
      document.querySelectorAll('#gender option').forEach(function(opt) {
        if (genderOptions[opt.value]) opt.textContent = genderOptions[opt.value];
      });
      document.getElementById('idCard').previousElementSibling.innerHTML = 'ID Number <span class="required">*</span>';
    }

    function toggleOrgSelect() {
      var el = document.getElementById('orgSelect');
      var isOpen = el.classList.contains('open');
      if (isOpen) {
        el.classList.remove('open');
      } else {
        document.querySelectorAll('.form-select-search.open').forEach(function(openEl) {
          openEl.classList.remove('open');
        });
        el.classList.add('open');
        renderOrgOptions(orgData);
        el.querySelector('.select-search input').focus();
      }
    }

    function renderOrgOptions(data) {
      var container = document.querySelector('#orgSelect .select-options');
      if (data.length === 0) {
        container.innerHTML = '<div class="select-empty">暂无匹配结果</div>';
        return;
      }
      container.innerHTML = data.map(function(org) {
        var isSelected = org.id == selectedOrgId;
        return '<div class="select-option' + (isSelected ? ' selected' : '') + '" data-id="' + org.id + '" onclick="selectOrg(\'' + org.id + '\', \'' + org.name + '\', \'' + org.type + '\')">' +
          '<span class="option-name">' + org.name + '</span>' +
          '<span class="option-type">' + org.type + '</span>' +
        '</div>';
      }).join('');
    }

    function filterOrgOptions(keyword) {
      var filtered = orgData.filter(function(org) {
        return org.name.indexOf(keyword) !== -1 || org.type.indexOf(keyword) !== -1;
      });
      renderOrgOptions(filtered);
    }

    function selectOrg(id, name, type) {
      selectedOrgId = id;
      selectedOrgName = name;
      var trigger = document.querySelector('#orgSelect .select-trigger');
      trigger.innerHTML = '<span class="option-name">' + name + '</span><span class="option-type">' + type + '</span><span class="arrow">▼</span>';
      document.getElementById('orgSelect').classList.remove('open');
    }

    document.addEventListener('click', function(e) {
      var orgSelect = document.getElementById('orgSelect');
      if (!orgSelect.contains(e.target)) {
        orgSelect.classList.remove('open');
      }
    });

    function init() {
      switchToInternational();
      if (selectedOrgId && selectedOrgName) {
        var org = orgData.find(function(o) { return o.id == selectedOrgId; });
        if (org) {
          var trigger = document.querySelector('#orgSelect .select-trigger');
          trigger.innerHTML = '<span class="option-name">' + org.name + '</span><span class="option-type">' + org.type + '</span><span class="arrow">▼</span>';
        }
      }
      var data = JSON.parse(localStorage.getItem('reg_step2') || '{}');
      if (data.realName) document.getElementById('realName').value = data.realName;
      if (data.gender) document.getElementById('gender').value = data.gender;
      if (data.birthDate) document.getElementById('birthDate').value = data.birthDate;
      if (data.ethnicity) document.getElementById('ethnicity').value = data.ethnicity;
      if (data.idCard) document.getElementById('idCard').value = data.idCard;
      if (data.politicalStatus) document.getElementById('politicalStatus').value = data.politicalStatus;
      if (data.region) document.getElementById('region').value = data.region;
      if (data.detailAddress) document.getElementById('detailAddress').value = data.detailAddress;
      if (data.email) document.getElementById('email').value = data.email;
      if (data.nationality) document.getElementById('nationality').value = data.nationality;
      if (data.passport) document.getElementById('passport').value = data.passport;
      if (data.birthplace) document.getElementById('birthplace').value = data.birthplace;
      if (data.education) document.getElementById('education').value = data.education;
      if (data.gradSchool) document.getElementById('gradSchool').value = data.gradSchool;
      if (data.major) document.getElementById('major').value = data.major;
      if (data.titleIdentity) document.getElementById('titleIdentity').value = data.titleIdentity;
      if (data.company) document.getElementById('company').value = data.company;
      if (data.schoolName) document.getElementById('schoolName').value = data.schoolName;
      if (data.schoolMajor) document.getElementById('schoolMajor').value = data.schoolMajor;
      if (data.admissionDate) document.getElementById('admissionDate').value = data.admissionDate;
      if (data.graduationDate) document.getElementById('graduationDate').value = data.graduationDate;
      if (data.studentId) document.getElementById('studentId').value = data.studentId;
      if (data.interestBranches && data.interestBranches.length) {
        Array.from(document.getElementById('interestBranches').options).forEach(function(option) {
          option.selected = data.interestBranches.indexOf(option.value) !== -1;
        });
      }
    }

    function saveData() {
      localStorage.setItem('reg_org_id', selectedOrgId);
      localStorage.setItem('reg_org_name', selectedOrgName);
      var data = {
        realName: document.getElementById('realName').value,
        gender: document.getElementById('gender').value,
        birthDate: document.getElementById('birthDate').value,
        ethnicity: document.getElementById('ethnicity').value,
        idCard: document.getElementById('idCard').value,
        politicalStatus: document.getElementById('politicalStatus').value,
        region: document.getElementById('region').value,
        detailAddress: document.getElementById('detailAddress').value,
        email: document.getElementById('email').value,
        nationality: document.getElementById('nationality').value,
        passport: document.getElementById('passport').value,
        birthplace: document.getElementById('birthplace').value,
        education: document.getElementById('education').value,
        gradSchool: document.getElementById('gradSchool').value,
        major: document.getElementById('major').value,
        titleIdentity: document.getElementById('titleIdentity').value,
        company: document.getElementById('company').value,
        schoolName: document.getElementById('schoolName').value,
        schoolMajor: document.getElementById('schoolMajor').value,
        admissionDate: document.getElementById('admissionDate').value,
        graduationDate: document.getElementById('graduationDate').value,
        studentId: document.getElementById('studentId').value,
        interestBranches: Array.from(document.getElementById('interestBranches').selectedOptions).map(function(option) { return option.value; })
      };
      localStorage.setItem('reg_step2', JSON.stringify(data));
    }

    function saveOnly() {
      saveData();
      showToast('保存成功');
    }

    function goPrev() {
      saveData();
      location.href = 'register-personal-type.html';
    }

    function goNext() {
      saveData();
      location.href = 'register-personal-step4.html';
    }

    init();
  </script>
</body>
</html>
